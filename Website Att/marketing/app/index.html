<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vagai Silambam — App</title>
  <style>
    /* Minimal redirect page — no flash of unstyled content */
    body { margin: 0; background: #0d0d1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; color: #fff; }
    .brand { text-align: center; }
    .brand svg { width: 56px; height: 56px; fill: #a78bfa; margin-bottom: 12px; }
    .brand h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .brand p { color: #888; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 24 24"><path d="M4.5 3L3 4.5 19.5 21l1.5-1.5L4.5 3zm15 0l-4.5 4.5 1.5 1.5L21 4.5 19.5 3zM3 19.5L7.5 15l-1.5-1.5L1.5 18 3 19.5z"/></svg>
    <h1>Vagai Silambam</h1>
    <p>Redirecting to app…</p>
  </div>
  <script type="module">
    // The SaaS portal lives in /frontend/ at the repository root.
    // When deployed, point window.VAGAI_API_BASE to the production API URL.
    const ACCESS_KEY = 'vagai_access_token';
    const hasSession = !!localStorage.getItem(ACCESS_KEY);
    // Redirect relative to the repo structure
    const base = '../../frontend/';
    location.replace(base + (hasSession ? 'dashboard.html' : 'login.html'));
  </script>
</body>
</html>
