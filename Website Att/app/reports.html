<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports &amp; Analytics · Vagai Silambam</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .export-tile {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      background: var(--surface);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      flex: 1;
      min-width: 260px;
    }
    .export-tile:hover {
      border-color: var(--primary-glow);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .export-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--primary-muted);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-size: 24px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <script type="module">
    import { api } from './assets/js/api.js';
    import { applyTranslations } from './assets/js/i18n.js';
    import { mountShell, requireSession, toast } from './assets/js/auth.js';

    if (requireSession()) {
      const page = mountShell({ titleKey: 'nav_reports' });
      render(page);
    }

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    async function downloadCSV(promise, filename) {
      try {
        const res = await promise;
        if (!res.ok) { toast('Export failed', 'error'); return; }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
        toast(`Exported ${filename} successfully`, 'success');
      } catch (err) { toast(err.message, 'error'); }
    }

    async function render(page) {
      page.innerHTML = '<div class="stat-grid">' + '<div class="stat"><div class="skeleton" style="width:60%"></div></div>'.repeat(5) + '</div>';

      try {
        const summary = await api.reportsSummary();

        page.innerHTML = `
          <div class="stat-grid">
            <div class="stat" style="border-left-color:var(--primary)">
              <div class="label">Active Enrolled Students</div>
              <div class="value">${summary.active_students}</div>
              <div class="sub">Currently training</div>
            </div>
            <div class="stat" style="border-left-color:var(--accent)">
              <div class="label">Total Fees Collected</div>
              <div class="value" style="color:#059669">₹${summary.fees_collected.toLocaleString()}</div>
              <div class="sub">Total revenue</div>
            </div>
            <div class="stat" style="border-left-color:var(--crimson)">
              <div class="label">Pending Receivables</div>
              <div class="value" style="color:#BE123C">₹${summary.pending_fees.toLocaleString()}</div>
              <div class="sub">Outstanding dues</div>
            </div>
            <div class="stat" style="border-left-color:var(--gold)">
              <div class="label">Upcoming Events</div>
              <div class="value">${summary.upcoming_events}</div>
              <div class="sub">Gradings &amp; Tournaments</div>
            </div>
            <div class="stat" style="border-left-color:var(--purple)">
              <div class="label">Pending Uniforms</div>
              <div class="value">${summary.pending_uniforms}</div>
              <div class="sub">Awaiting delivery</div>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <h3><span>📥</span> Export Academy Data Records</h3>
            </div>
            <div style="display:flex;gap:16px;flex-wrap:wrap">
              <div class="export-tile">
                <div class="export-icon">👥</div>
                <div style="flex:1">
                  <div style="font-weight:700;font-size:15px">Students Master List</div>
                  <div style="font-size:12.5px;color:var(--text-muted);margin:2px 0 12px">All registered students, IDs, contact numbers and rank</div>
                  <button id="expStudents" class="btn btn-primary btn-sm">Download Students CSV</button>
                </div>
              </div>
              <div class="export-tile">
                <div class="export-icon" style="background:#ECFDF5;color:#059669">₹</div>
                <div style="flex:1">
                  <div style="font-weight:700;font-size:15px">Fee Invoices &amp; Receipts</div>
                  <div style="font-size:12.5px;color:var(--text-muted);margin:2px 0 12px">All payments, due dates, receipt IDs and payment statuses</div>
                  <button id="expFees" class="btn btn-primary btn-sm" style="background:#059669">Download Fees CSV</button>
                </div>
              </div>
            </div>
          </div>`;

        applyTranslations(page);

        document.getElementById('expStudents').addEventListener('click', () =>
          downloadCSV(api.exportStudentsCSV(), 'students.csv')
        );
        document.getElementById('expFees').addEventListener('click', () =>
          downloadCSV(api.exportFeesCSV(), 'fees.csv')
        );

      } catch (err) {
        page.innerHTML = `<div class="alert alert-error">${esc(err.message)}</div>`;
      }
    }
  </script>
</body>
</html>
