<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users & Licenses · Vagai Silambam</title>
  <link rel="stylesheet" href="assets/css/style.css">  <style>
    .page-header-row { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
    .page-title h1 { font-size:22px; font-weight:800; color:var(--text); letter-spacing:-0.4px; }
    .page-title p  { font-size:13.5px; color:var(--text-muted); margin-top:3px; }

    /* Metric cards */
    .metric-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:24px; }
    .metric-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; box-shadow:var(--shadow-xs); position:relative; overflow:hidden; }
    .metric-card::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; background:var(--mc-color,var(--primary)); border-radius:0 0 2px 2px; }
    .metric-info .lbl { font-size:10.5px; font-weight:800; letter-spacing:0.6px; text-transform:uppercase; color:var(--text-muted); margin-bottom:5px; }
    .metric-info .val { font-size:26px; font-weight:800; color:var(--text); letter-spacing:-0.5px; }
    .metric-icon { width:44px; height:44px; border-radius:13px; display:grid; place-items:center; flex-shrink:0; }
    .mc-violet { --mc-color:#1D3B47; } .mc-violet .metric-icon { background:rgba(29, 59, 71, 0.4); color:#E8873A; }
    .mc-green  { --mc-color:#34D399; } .mc-green  .metric-icon { background:rgba(52, 211, 153, 0.16); color:#6EE7B7; }
    .mc-red    { --mc-color:#EF4444; } .mc-red    .metric-icon { background:rgba(248, 113, 113, 0.15); color:#FCA5A5; }
    .mc-amber  { --mc-color:#E8873A; } .mc-amber  .metric-icon { background:rgba(232, 135, 58, 0.16); color:#E8873A; }

    /* Toolbar */
    .toolbar { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
    .search-box { display:flex; align-items:center; gap:8px; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-md); padding:8px 14px; flex:1; min-width:220px; }
    .search-box input { border:none; outline:none; font-family:inherit; font-size:13.5px; color:var(--text); background:transparent; flex:1; }
    select.filter-sel { padding:8px 14px; border:1.5px solid var(--border); border-radius:var(--radius-md); font-family:inherit; font-size:13px; color:var(--text); background:var(--surface); outline:none; cursor:pointer; }

    .table-wrap { overflow-x:auto; border-radius:var(--radius-lg); border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow-xs); }
    table { width:100%; border-collapse:collapse; }
    thead th { background:var(--surface-subtle); padding:11px 16px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-muted); text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
    tbody td { padding:12px 16px; font-size:13.5px; color:var(--text); border-bottom:1px solid var(--border-light); vertical-align:middle; }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr:hover td { background:rgba(255, 255, 255, 0.03); }

    .badge { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:6px; font-size:11.5px; font-weight:700; }
    .badge-green  { background:rgba(52, 211, 153, 0.16); color:#6EE7B7; border:1px solid rgba(52, 211, 153, 0.3); }
    .badge-red    { background:rgba(248, 113, 113, 0.15); color:#FCA5A5; border:1px solid rgba(248, 113, 113, 0.3); }
    .badge-amber  { background:rgba(201, 162, 90, 0.16); color:#C9A25A; border:1px solid rgba(201, 162, 90, 0.3); }
    .badge-blue   { background:rgba(232, 135, 58, 0.16); color:#E8873A; border:1px solid rgba(232, 135, 58, 0.3); }
    .badge-gray   { background:rgba(237, 230, 218, 0.08); color:#EDE6DA; }
    .badge-violet { background:rgba(29, 59, 71, 0.45); color:#C9A25A; border:1px solid rgba(29, 59, 71, 0.6); }

    /* License key */
    .lic-key {
      font-family: 'SFMono-Regular',Consolas,monospace;
      font-size:12px; letter-spacing:0.5px;
      background:rgba(29, 59, 71, 0.4); color:#E8873A;
      border:1px solid rgba(232, 135, 58, 0.3); border-radius:7px;
      padding:4px 9px; cursor:pointer;
      user-select:all; display:inline-flex; align-items:center; gap:5px;
    }
    .lic-key:hover { background:rgba(255, 255, 255, 0.1); }

    /* Actions */
    .actions-wrap { position:relative; }
    .actions-btn { border:none; background:transparent; cursor:pointer; padding:6px; border-radius:8px; color:var(--text-muted); display:flex; align-items:center; transition:background 0.15s; }
    .actions-btn:hover { background:var(--surface-subtle); color:var(--text); }
    .actions-menu { position:absolute; right:0; top:calc(100%+4px); z-index:50; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-lg); min-width:190px; overflow:hidden; }
    .actions-menu[hidden] { display:none; }
    .actions-menu button { display:flex; align-items:center; gap:10px; width:100%; padding:10px 16px; background:none; border:none; font-family:inherit; font-size:13.5px; color:var(--text); cursor:pointer; text-align:left; transition:background 0.12s; }
    .actions-menu button:hover { background:var(--surface-subtle); }
    .actions-menu button.danger { color:#EF4444; }
    .actions-menu button.danger:hover { background:rgba(248, 113, 113, 0.12); }

    /* Generate License Modal */
    .modal-backdrop { position:fixed; inset:0; background:rgba(10,19,36,0.55); backdrop-filter:blur(4px); z-index:200; display:grid; place-items:center; padding:20px; }
    .modal-backdrop[hidden] { display:none; }
    /* .btn and other classes set display, which would otherwise override the hidden attribute */
    [hidden] { display:none !important; }
    /* The card never outgrows the screen: header and footer stay put and only the body scrolls. */
    .modal-card { width:100%; max-width:480px; max-height:calc(100vh - 40px); max-height:calc(100dvh - 40px); display:flex; flex-direction:column; background:var(--surface); border-radius:var(--radius-xl); border:1px solid var(--border); box-shadow:0 24px 60px rgba(10,19,36,0.25); overflow:hidden; animation:slideUp 0.3s cubic-bezier(0.16,1,0.3,1); }
    .modal-head, .modal-footer { flex-shrink:0; }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
    .modal-head { padding:18px 24px; background:var(--surface-subtle); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .modal-head h3 { font-size:16px; font-weight:800; }
    .modal-close { border:none; background:none; cursor:pointer; color:var(--text-muted); padding:4px; border-radius:8px; }
    .modal-close:hover { background:var(--border); }
    .modal-body { padding:24px; flex:1 1 auto; min-height:0; overflow-y:auto; }
    .modal-footer { padding:16px 24px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px; }
    .field input, .field select { width:100%; padding:10px 14px; border:1.5px solid var(--border); border-radius:var(--radius-md); font-family:inherit; font-size:14px; color:var(--text); background:rgba(255, 255, 255, 0.04); outline:none; transition:border-color 0.2s; }
    .field input:focus, .field select:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,0.1); }
    .alert-err { background:rgba(248, 113, 113, 0.12); border:1px solid rgba(248, 113, 113, 0.35); color:#FCA5A5; padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:14px; }

    /* Read-only facts that fill in once an academy or plan is picked */
    .info-card { border:1px solid var(--border); background:var(--surface-subtle); border-radius:var(--radius-md); padding:12px 14px; margin:-6px 0 16px; font-size:13px; }
    .info-card .row { display:flex; justify-content:space-between; gap:12px; padding:3px 0; }
    .info-card .row span:first-child { color:var(--text-muted); }
    .info-card .row span:last-child { font-weight:600; text-align:right; word-break:break-word; }
    .info-card .head { font-weight:700; margin-bottom:4px; }

    /* New license reveal banner */
    .license-reveal {
      background:linear-gradient(135deg,#F0FDF4,rgba(52, 211, 153, 0.12));
      border:1.5px solid #86EFAC; border-radius:14px; padding:18px 20px; margin-bottom:16px;
    }
    .license-reveal h4 { font-size:14px; font-weight:800; color:#6EE7B7; margin-bottom:8px; }
    .lic-big {
      font-family:monospace; font-size:15px; font-weight:700; letter-spacing:1.5px;
      background:var(--surface); color:#6EE7B7; border:1.5px solid #86EFAC;
      border-radius:10px; padding:10px 16px; cursor:pointer;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      word-break:break-all;
    }
    .lic-big:hover { background:#F0FDF4; }
    .lic-big small { color:#10B981; font-size:11px; flex-shrink:0; }
  </style>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
</head>
<body>
<script type="module">
  import { requireSession, mountShell, toast, isSuperAdmin } from './assets/js/auth.js';
  import { api } from './assets/js/api.js';

  if (!requireSession()) throw new Error('redirect');
  mountShell({ title: 'Users & Licenses' });

  const pg = document.getElementById('page');

  pg.innerHTML = `
    <div class="page-header-row">
      <div class="page-title">
        <h1>Users & Licenses</h1>
        <p>Generate, revoke and manage app access licenses</p>
      </div>
      <button class="btn btn-primary" id="gen-lic-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Generate License
      </button>
      <button class="btn btn-primary" id="add-member-btn" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        Add Member
      </button>
    </div>

    <!-- Metric cards -->
    <div class="metric-grid" id="lic-metrics">
      ${['','','',''].map(()=>`<div class="metric-card"><div class="metric-info"><div class="lbl"><span class="skeleton" style="width:70px;height:10px;display:block"></span></div><div class="val"><span class="skeleton" style="width:50px;height:24px;display:block;margin-top:5px"></span></div></div></div>`).join('')}
    </div>

    <div class="toolbar">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="lic-search" placeholder="Search academy, license key…">
      </div>
      <select class="filter-sel" id="lic-status">
        <option value="">All Statuses</option>
        <option value="ACTIVE">Active</option>
        <option value="REVOKED">Revoked</option>
        <option value="EXPIRED">Expired</option>
      </select>
      <select class="filter-sel" id="lic-org">
        <option value="">All Academies</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>License Key</th>
            <th>Academy</th>
            <th>Assigned User</th>
            <th>Status</th>
            <th>Issued</th>
            <th>Expires</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="lic-tbody">
          <tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted)">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Member Modal: add a member with a role, or change a member's role -->
    <div class="modal-backdrop" id="member-modal" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <h3 id="m-title">Add Member</h3>
          <button class="modal-close" id="m-close-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="license-reveal" id="m-reveal" hidden>
            <h4>✅ Member licensed</h4>
            <p style="font-size:12.5px;color:#6EE7B7;margin-bottom:10px">Copy this key now. It is shown only once.</p>
            <div class="lic-big" onclick="copyMemberKey()">
              <span id="m-key">—</span>
              <small>Click to copy</small>
            </div>
          </div>
          <div class="alert-err" id="m-err" hidden></div>
          <div class="field"><label>Username *</label>
            <input id="m-username" autocomplete="off" placeholder="e.g. coach.raj">
          </div>
          <div class="field" id="m-password-field"><label>Temporary password *</label>
            <input id="m-password" type="password" autocomplete="new-password" placeholder="At least 8 characters">
          </div>
          <div class="field"><label>Full name *</label>
            <input id="m-name" placeholder="Full name">
          </div>
          <div class="field"><label>Role *</label>
            <select id="m-role">
              <option value="INSTRUCTOR">Instructor</option>
              <option value="STAFF">Staff</option>
              <option value="STAFF_ACCOUNTANT">Accountant</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="m-cancel-btn">Close</button>
          <button class="btn btn-primary" id="m-submit">Add Member</button>
        </div>
      </div>
    </div>

    <!-- Generate License Modal -->
    <div class="modal-backdrop" id="gen-modal" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <h3>🛡️ Generate License</h3>
          <button class="modal-close" id="gen-close-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="license-reveal" id="new-lic-reveal" hidden>
            <h4>✅ License Generated!</h4>
            <p style="font-size:12.5px;color:#6EE7B7;margin-bottom:10px">Copy this key — share it with the academy admin.</p>
            <div class="lic-big" id="new-lic-key" onclick="copyLicKey()">
              <span id="new-lic-text">—</span>
              <small>Click to copy</small>
            </div>
          </div>
          <div class="alert-err" id="gen-err" hidden></div>
          <div class="field" id="g-org-field"><label>Academy *</label>
            <select id="g-org"><option value="">Select academy…</option></select>
          </div>
          <div class="info-card" id="g-owner" hidden></div>
          <div class="field" id="g-plan-field"><label>Plan *</label>
            <select id="g-plan" disabled><option value="">Select plan…</option></select>
          </div>
          <div class="field" id="g-term-field"><label>Duration</label>
            <select id="g-term" disabled>
              <option value="1">1 month</option>
              <option value="3">3 months</option>
              <option value="6">6 months</option>
              <option value="12">12 months (1 year)</option>
            </select>
          </div>
          <div class="info-card" id="g-plan-info" hidden></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="gen-cancel-btn">Close</button>
          <button class="btn btn-primary" id="gen-submit-btn">Upgrade &amp; Generate License</button>
        </div>
      </div>
    </div>
  `;

  // Super Admin sees every academy and seat license. Academy admins manage their own members.
  const superAdmin = isSuperAdmin();
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const shortKey = k => k.length > 28 ? k.slice(0, 14) + '…' + k.slice(-8) : k;
  const ROLE_LABELS = { ADMIN: 'Admin', SUPER_ADMIN: 'Super Admin', INSTRUCTOR: 'Instructor', STAFF: 'Staff', STAFF_ACCOUNTANT: 'Accountant' };

  let rows = [];
  let orgData = [];
  let memberMode = 'add';
  let memberRowId = null;

  // Modals live on <body> so the backdrop covers the sidebar and top bar too, not just the page content.
  ['gen-modal', 'member-modal'].forEach(id => document.body.append(document.getElementById(id)));

  let plans = [];
  if (superAdmin) {
    document.getElementById('add-member-btn').hidden = true;
    try {
      const res = await api.listOrganizations();
      orgData = res.organizations || [];
    } catch { orgData = []; }
    try {
      plans = (await api.adminPlans()).filter(p => p.is_active);
    } catch { plans = []; }
    const opts = orgData.map(o => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('');
    document.getElementById('lic-org').insertAdjacentHTML('beforeend', opts);
    document.getElementById('g-org').insertAdjacentHTML('beforeend', opts);
    document.getElementById('g-plan').insertAdjacentHTML('beforeend',
      plans.map(p => `<option value="${esc(p.code)}">${esc(p.name)}</option>`).join(''));
  } else {
    document.getElementById('gen-lic-btn').hidden = true;
    document.getElementById('g-org-field').hidden = true;
    document.getElementById('gen-submit-btn').hidden = true;
    document.getElementById('lic-org').hidden = true;
    document.getElementById('add-member-btn').hidden = false;
    document.getElementById('add-member-btn').addEventListener('click', () => openMemberModal('add'));
  }

  async function loadRows() {
    if (superAdmin) {
      const list = await api.listAcademyLicenses();
      rows = list.map(l => ({
        id: l.license_id,
        key: l.license_key,
        status: l.status,
        scope: l.scope,
        orgId: l.organization_id,
        orgName: l.organization_name,
        person: l.full_name_en || '',
        username: l.username || '',
        role: null,
        issuedAt: l.issued_at,
        expiresAt: l.expires_at,
      }));
    } else {
      const users = await api.listUsers();
      rows = (users || []).map(u => ({
        id: u.id,
        key: null,
        status: u.license_status || (u.role === 'ADMIN' ? 'ACTIVE' : 'NONE'),
        scope: 'SEAT',
        orgId: null,
        orgName: 'Your academy',
        person: u.full_name_en || '',
        username: u.username || '',
        role: u.role,
        issuedAt: null,
        expiresAt: null,
      }));
    }
  }

  function updateMetrics() {
    const total = rows.length;
    const active = rows.filter(r => r.status === 'ACTIVE').length;
    const revoked = rows.filter(r => r.status === 'REVOKED').length;
    const expiring = rows.filter(r => {
      if (!r.expiresAt) return false;
      const d = Math.ceil((new Date(r.expiresAt) - Date.now()) / 86400000);
      return d > 0 && d <= 30;
    }).length;

    document.getElementById('lic-metrics').innerHTML = `
      <div class="metric-card mc-violet">
        <div class="metric-info"><div class="lbl">Total Licenses</div><div class="val">${total}</div></div>
        <div class="metric-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      </div>
      <div class="metric-card mc-green">
        <div class="metric-info"><div class="lbl">Active</div><div class="val">${active}</div></div>
        <div class="metric-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>
      <div class="metric-card mc-red">
        <div class="metric-info"><div class="lbl">Revoked</div><div class="val">${revoked}</div></div>
        <div class="metric-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg></div>
      </div>
      <div class="metric-card mc-amber">
        <div class="metric-info"><div class="lbl">Expiring Soon</div><div class="val">${expiring}</div></div>
        <div class="metric-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
      </div>
    `;
  }

  function renderTable() {
    const q = document.getElementById('lic-search').value.trim().toLowerCase();
    const sf = document.getElementById('lic-status').value;
    const of = document.getElementById('lic-org').value;

    const list = rows.filter(r => {
      if (sf && r.status !== sf) return false;
      if (of && r.orgId !== of) return false;
      const txt = `${r.orgName} ${r.person} ${r.username} ${r.key || ''}`.toLowerCase();
      return !q || txt.includes(q);
    });

    document.getElementById('lic-tbody').innerHTML = list.map(r => {
      const cls = r.status === 'ACTIVE' ? 'badge-green' : r.status === 'REVOKED' ? 'badge-red' : r.status === 'EXPIRED' ? 'badge-amber' : 'badge-gray';
      const keyCell = r.key
        ? `<span class="lic-key" onclick="copyKey('${esc(r.key)}')">${esc(shortKey(r.key))}</span>`
        : `<span style="font-size:12px;color:var(--text-muted)">${superAdmin ? '—' : 'Shown once when issued'}</span>`;
      const roleText = r.role ? ` · ${esc(ROLE_LABELS[r.role] || r.role)}` : '';
      const who = r.scope === 'ACADEMY'
        ? '<span class="badge badge-violet">Academy-wide</span>'
        : `<div style="font-weight:600;font-size:13px">${esc(r.person || '—')}</div><div style="font-size:11.5px;color:var(--text-muted)">@${esc(r.username)}${roleText}</div>`;
      const issued = r.issuedAt ? new Date(r.issuedAt).toLocaleDateString('en-IN') : '—';
      const exp = r.expiresAt ? new Date(r.expiresAt).toLocaleDateString('en-IN') : '—';

      const menu = [];
      if (r.key) menu.push(`<button onclick="copyKey('${esc(r.key)}')">Copy Key</button>`);
      if (superAdmin) {
        if (r.scope === 'ACADEMY') {
          menu.push(`<button onclick="openUpgrade('${esc(r.orgId)}')">Upgrade</button>`);
        }
        if (r.status === 'ACTIVE') {
          menu.push(`<button class="danger" onclick="revokeLic('${esc(r.id)}')">Revoke License</button>`);
        } else if (r.scope === 'ACADEMY') {
          menu.push(`<button onclick="reactivateLic('${esc(r.id)}')">Reactivate</button>`);
        }
      } else if (r.role !== 'ADMIN' && r.role !== 'SUPER_ADMIN') {
        menu.push(`<button onclick="openRoleModal('${esc(r.id)}')">Change Role</button>`);
        menu.push(`<button onclick="reactivateLic('${esc(r.id)}')">Reissue License</button>`);
        if (r.status === 'ACTIVE') {
          menu.push(`<button class="danger" onclick="revokeLic('${esc(r.id)}')">Revoke License</button>`);
        }
      }

      return `<tr>
        <td>${keyCell}</td>
        <td>${esc(r.orgName)}</td>
        <td>${who}</td>
        <td><span class="badge ${cls}">${esc(r.status)}</span></td>
        <td>${issued}</td>
        <td>${exp}</td>
        <td>
          ${menu.length ? `<div class="actions-wrap">
            <button class="actions-btn" onclick="toggleLicMenu('${esc(r.id)}',this)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
            </button>
            <div class="actions-menu" id="lmenu-${esc(r.id)}" hidden>${menu.join('')}</div>
          </div>` : ''}
        </td>
      </tr>`;
    }).join('') || `<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted)">No licenses found</td></tr>`;
  }

  async function refresh() {
    try {
      await loadRows();
      updateMetrics();
      renderTable();
    } catch (e) {
      document.getElementById('lic-tbody').innerHTML = `<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted)">Failed to load: ${esc(e.message)}</td></tr>`;
    }
  }

  await refresh();

  // Filters
  ['lic-search', 'lic-status', 'lic-org'].forEach(id => {
    document.getElementById(id).addEventListener('input', renderTable);
    document.getElementById(id).addEventListener('change', renderTable);
  });

  function closeMenus() {
    document.querySelectorAll('.actions-menu').forEach(m => m.hidden = true);
  }

  function showReveal(key) {
    document.getElementById('new-lic-text').textContent = key;
    document.getElementById('new-lic-reveal').hidden = false;
    document.getElementById('gen-modal').hidden = false;
    document.querySelector('#gen-modal .modal-body').scrollTop = 0;
  }

  // Member modal: "add" creates a member with a role; "role" changes an existing member's role.
  function openMemberModal(mode, rowId = null) {
    memberMode = mode;
    memberRowId = rowId;
    const row = rows.find(r => r.id === rowId);
    const isAdd = mode === 'add';
    document.getElementById('m-title').textContent = isAdd ? 'Add Member' : 'Change Role';
    document.getElementById('m-username').value = isAdd ? '' : (row?.username || '');
    document.getElementById('m-name').value = isAdd ? '' : (row?.person || '');
    document.getElementById('m-password').value = '';
    document.getElementById('m-role').value = (isAdd ? 'INSTRUCTOR' : row?.role) || 'INSTRUCTOR';
    document.getElementById('m-username').disabled = !isAdd;
    document.getElementById('m-name').disabled = !isAdd;
    document.getElementById('m-password-field').hidden = !isAdd;
    document.getElementById('m-reveal').hidden = true;
    document.getElementById('m-err').hidden = true;
    document.getElementById('m-submit').hidden = false;
    document.getElementById('m-submit').textContent = isAdd ? 'Add Member' : 'Save Role';
    document.getElementById('member-modal').hidden = false;
  }

  function closeMemberModal() {
    document.getElementById('member-modal').hidden = true;
  }

  window.openRoleModal = function (id) {
    closeMenus();
    openMemberModal('role', id);
  };

  ['m-close-btn', 'm-cancel-btn'].forEach(id => {
    document.getElementById(id).addEventListener('click', closeMemberModal);
  });

  document.getElementById('m-submit').addEventListener('click', async () => {
    const err = document.getElementById('m-err');
    const btn = document.getElementById('m-submit');
    const role = document.getElementById('m-role').value;
    err.hidden = true;
    btn.disabled = true;
    try {
      if (memberMode === 'add') {
        const username = document.getElementById('m-username').value.trim();
        const fullName = document.getElementById('m-name').value.trim();
        const password = document.getElementById('m-password').value;
        if (!username || !fullName) throw new Error('Enter a username and full name.');
        if (password.length < 8) throw new Error('Password must be at least 8 characters.');
        const res = await api.createUser({ username, full_name_en: fullName, password, role });
        document.getElementById('m-key').textContent = res.license_key;
        document.getElementById('m-reveal').hidden = false;
        btn.hidden = true;
        toast('Member added', 'success');
      } else {
        await api.changeMemberRole(memberRowId, role);
        toast('Role updated', 'success');
        closeMemberModal();
      }
      await refresh();
    } catch (e) {
      err.textContent = e.message || 'Could not save.';
      err.hidden = false;
    } finally {
      btn.disabled = false;
    }
  });

  window.copyMemberKey = async function () {
    const key = document.getElementById('m-key').textContent;
    try { await navigator.clipboard.writeText(key); toast('License key copied!', 'success'); } catch { /* */ }
  };

  window.toggleLicMenu = function (id, btn) {
    document.querySelectorAll('.actions-menu').forEach(m => { if (m.id !== `lmenu-${id}`) m.hidden = true; });
    const m = document.getElementById(`lmenu-${id}`);
    m.hidden = !m.hidden;
  };
  document.addEventListener('click', e => {
    if (!e.target.closest('.actions-wrap')) closeMenus();
  });

  window.copyKey = async function (key) {
    closeMenus();
    try {
      await navigator.clipboard.writeText(key);
      toast('License key copied!', 'success');
    } catch { toast('Copy key: ' + key, 'info'); }
  };

  window.revokeLic = async function (id) {
    closeMenus();
    if (!confirm('Revoke this license? The user will lose app access immediately.')) return;
    try {
      if (superAdmin) await api.revokeAcademyLicense(id);
      else await api.revokeLicense(id);
      toast('License revoked', 'success');
      await refresh();
    } catch (e) { toast(e.message, 'error'); }
  };

  window.reactivateLic = async function (id) {
    closeMenus();
    const row = rows.find(r => r.id === id);
    try {
      // Super Admin: issue a new academy license. Academy admin: reissue the member's seat.
      const res = superAdmin ? await api.generateAcademyLicense(row.orgId) : await api.reissueLicense(id);
      toast('License issued!', 'success');
      if (res?.license_key) showReveal(res.license_key);
      await refresh();
    } catch (e) { toast(e.message, 'error'); }
  };

  window.copyLicKey = async function () {
    const key = document.getElementById('new-lic-text').textContent;
    try { await navigator.clipboard.writeText(key); toast('Copied!', 'success'); } catch { /* */ }
  };

  // Upgrade / Generate License modal (Super Admin only). Picking an academy fetches its owner and
  // current plan; picking a plan and duration shows the limits, price and the resulting expiry date.
  const fmtDate = d => new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  const money = n => '₹' + Number(n).toLocaleString('en-IN');
  const infoRow = (label, value) => `<div class="row"><span>${label}</span><span>${esc(value)}</span></div>`;
  let overview = null;

  // Same rule as the server: renewing the current paid plan extends it, anything else starts today.
  function projectedExpiry(plan, months) {
    const renewing = overview && overview.plan_code === plan.code && overview.subscription_status === 'ACTIVE'
      && overview.expires_at && new Date(overview.expires_at) > new Date();
    const d = renewing ? new Date(overview.expires_at) : new Date();
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + months);
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
    return { date: d, renewing };
  }

  function renderPlanInfo() {
    const box = document.getElementById('g-plan-info');
    const plan = plans.find(p => p.code === document.getElementById('g-plan').value);
    if (!plan || !overview) { box.hidden = true; return; }
    const months = Number(document.getElementById('g-term').value);
    const price = months === 12 ? plan.price_annual : plan.price_monthly * months;
    const { date, renewing } = projectedExpiry(plan, months);
    box.innerHTML = `<div class="head">${esc(plan.name)}</div>`
      + infoRow('Students', plan.max_students)
      + infoRow('Branches', plan.max_branches)
      + infoRow('Team members', plan.max_users)
      + infoRow(`Price for ${months === 12 ? '1 year' : months + (months === 1 ? ' month' : ' months')}`, money(price))
      + infoRow(renewing ? 'Extends current term to' : 'Expires on', fmtDate(date));
    box.hidden = false;
  }

  async function loadOverview(orgId) {
    const owner = document.getElementById('g-owner');
    const planSel = document.getElementById('g-plan');
    const termSel = document.getElementById('g-term');
    overview = null;
    document.getElementById('g-plan-info').hidden = true;
    planSel.disabled = termSel.disabled = !orgId;
    if (!orgId) { owner.hidden = true; planSel.value = ''; return; }
    try {
      overview = await api.academyLicenseOverview(orgId);
    } catch (e) {
      owner.hidden = true;
      const err = document.getElementById('gen-err');
      err.textContent = e.message || 'Could not load this academy.';
      err.hidden = false;
      return;
    }
    document.getElementById('gen-err').hidden = true;
    const a = overview.admin;
    owner.innerHTML = `<div class="head">Assigned user</div>`
      + (a
        ? infoRow('Name', a.full_name_en) + infoRow('Username', '@' + a.username)
          + infoRow('Email', a.email) + (a.phone ? infoRow('Phone', a.phone) : '')
        : infoRow('Admin', 'No admin account'))
      + infoRow('Current plan', overview.plan_code ? `${overview.plan_code} · ${overview.subscription_status}` : 'None')
      + infoRow('Current expiry', overview.expires_at ? fmtDate(overview.expires_at) : '—')
      + infoRow('License key', overview.license_key ? shortKey(overview.license_key) : 'Not issued yet');
    owner.hidden = false;
    planSel.value = plans.some(p => p.code === overview.plan_code) ? overview.plan_code : '';
    renderPlanInfo();
  }

  function openGenModal(orgId = '') {
    document.getElementById('new-lic-reveal').hidden = true;
    document.getElementById('gen-err').hidden = true;
    document.getElementById('g-org').value = orgId;
    document.getElementById('g-term').value = '1';
    document.getElementById('gen-modal').hidden = false;
    return loadOverview(orgId);
  }

  window.openUpgrade = function (orgId) {
    closeMenus();
    return openGenModal(orgId);
  };

  document.getElementById('gen-lic-btn').addEventListener('click', () => openGenModal());
  document.getElementById('g-org').addEventListener('change', e => loadOverview(e.target.value));
  ['g-plan', 'g-term'].forEach(id => document.getElementById(id).addEventListener('change', renderPlanInfo));
  ['gen-close-btn', 'gen-cancel-btn'].forEach(id => {
    document.getElementById(id).addEventListener('click', () => document.getElementById('gen-modal').hidden = true);
  });

  document.getElementById('gen-submit-btn').addEventListener('click', async () => {
    const err = document.getElementById('gen-err');
    const btn = document.getElementById('gen-submit-btn');
    const orgId = document.getElementById('g-org').value;
    const planCode = document.getElementById('g-plan').value;

    if (!orgId) { err.textContent = 'Please select an academy.'; err.hidden = false; return; }
    if (!planCode) { err.textContent = 'Please select a plan.'; err.hidden = false; return; }

    err.hidden = true;
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const res = await api.upgradeAcademy(orgId, {
        plan_code: planCode,
        duration_months: Number(document.getElementById('g-term').value),
      });
      showReveal(res.license_key);
      toast('Academy upgraded', 'success');
      await refresh();
      await loadOverview(orgId);
    } catch (e) {
      err.textContent = e.message || 'Could not upgrade this academy.';
      err.hidden = false;
    } finally {
      btn.disabled = false; btn.textContent = 'Upgrade & Generate License';
    }
  });

  // Arriving from the Customers page menu: licenses.html?upgrade=<academy id>
  const upgradeOrg = new URLSearchParams(location.search).get('upgrade');
  if (superAdmin && upgradeOrg && orgData.some(o => o.id === upgradeOrg)) openGenModal(upgradeOrg);
</script>
</body>
</html>
