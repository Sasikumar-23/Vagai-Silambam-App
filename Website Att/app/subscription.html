<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscriptions & Payments · Vagai Silambam</title>
  <link rel="stylesheet" href="assets/css/style.css">  <style>
    .page-header-row { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
    .page-title h1 { font-size:22px; font-weight:800; color:var(--text); letter-spacing:-0.4px; }
    .page-title p  { font-size:13.5px; color:var(--text-muted); margin-top:3px; }

    /* Tab bar */
    .tab-bar { display:flex; gap:4px; background:var(--surface-subtle); border:1px solid var(--border); border-radius:14px; padding:4px; margin-bottom:22px; width:fit-content; }
    .tab-btn { padding:8px 18px; border:none; background:transparent; border-radius:10px; font-family:inherit; font-size:13.5px; font-weight:600; color:var(--text-muted); cursor:pointer; transition:all 0.18s; }
    .tab-btn.active { background:var(--surface); color:var(--text); box-shadow:0 1px 6px rgba(15,23,42,0.1); }

    .tab-content { display:none; } .tab-content.active { display:block; }

    /* Plan cards */
    .plan-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:18px; margin-bottom:28px; }
    .plan-card {
      background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-lg);
      padding:22px; position:relative; transition:all 0.22s;
    }
    .plan-card:hover { border-color:var(--primary); box-shadow:0 8px 24px rgba(232,135,58,0.15); transform:translateY(-2px); }
    .plan-card.featured { border-color:#E8873A; background:linear-gradient(160deg, rgba(232, 135, 58, 0.12), rgba(29, 59, 71, 0.4)); box-shadow: 0 0 24px rgba(232, 135, 58, 0.2); }
    .plan-name { font-size:17px; font-weight:800; color:var(--text); margin-bottom:4px; }
    .plan-price { font-size:28px; font-weight:800; color:#E8873A; letter-spacing:-0.5px; }
    .plan-price span { font-size:14px; color:var(--text-muted); font-weight:500; }
    .plan-features { margin:14px 0; }
    .plan-features li { font-size:13px; color:var(--text-secondary); padding:4px 0; display:flex; gap:8px; align-items:center; list-style:none; }
    .plan-features li svg { color:#E8873A; flex-shrink:0; }
    .featured-badge { position:absolute; top:14px; right:14px; background:#E8873A; color:#0B1A20; font-size:10px; font-weight:800; letter-spacing:0.5px; padding:3px 9px; border-radius:6px; text-transform:uppercase; }

    /* Toolbar */
    .toolbar { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
    .search-box { display:flex; align-items:center; gap:8px; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-md); padding:8px 14px; flex:1; min-width:220px; }
    .search-box input { border:none; outline:none; font-family:inherit; font-size:13.5px; color:var(--text); background:transparent; flex:1; }
    select.filter-sel { padding:8px 14px; border:1.5px solid var(--border); border-radius:var(--radius-md); font-family:inherit; font-size:13px; color:var(--text); background:var(--surface); outline:none; cursor:pointer; }

    .table-wrap { overflow-x:auto; border-radius:var(--radius-lg); border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow-xs); }
    table { width:100%; border-collapse:collapse; }
    thead th { background:var(--surface-subtle); padding:11px 16px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-muted); text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
    tbody td { padding:12px 16px; font-size:13.5px; color:var(--text); border-bottom:1px solid var(--border-light); vertical-align:middle; }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr:hover td { background:rgba(255, 255, 255, 0.03); }

    .badge { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:6px; font-size:11.5px; font-weight:700; }
    .badge-green  { background:rgba(52, 211, 153, 0.16); color:#6EE7B7; border:1px solid rgba(52, 211, 153, 0.3); }
    .badge-red    { background:rgba(248, 113, 113, 0.15); color:#FCA5A5; border:1px solid rgba(248, 113, 113, 0.3); }
    .badge-amber  { background:rgba(201, 162, 90, 0.16); color:#C9A25A; border:1px solid rgba(201, 162, 90, 0.3); }
    .badge-blue   { background:rgba(232, 135, 58, 0.16); color:#E8873A; border:1px solid rgba(232, 135, 58, 0.3); }
    .badge-gray   { background:rgba(237, 230, 218, 0.08); color:#EDE6DA; }
    .badge-violet { background:rgba(29, 59, 71, 0.45); color:#C9A25A; border:1px solid rgba(29, 59, 71, 0.6); }

    /* Cash Payment Modal */
    .modal-backdrop { position:fixed; inset:0; background:rgba(10,19,36,0.55); backdrop-filter:blur(4px); z-index:200; display:grid; place-items:center; padding:20px; }
    .modal-backdrop[hidden] { display:none; }
    .modal-card { width:100%; max-width:500px; background:var(--surface); border-radius:var(--radius-xl); border:1px solid var(--border); box-shadow:0 24px 60px rgba(10,19,36,0.25); overflow:hidden; animation:slideUp 0.3s cubic-bezier(0.16,1,0.3,1); }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
    .modal-head { padding:18px 24px; background:var(--surface-subtle); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .modal-head h3 { font-size:16px; font-weight:800; }
    .modal-close { border:none; background:none; cursor:pointer; color:var(--text-muted); padding:4px; border-radius:8px; }
    .modal-close:hover { background:var(--border); }
    .modal-body { padding:24px; }
    .modal-footer { padding:16px 24px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px; }
    .field input, .field select { width:100%; padding:10px 14px; border:1.5px solid var(--border); border-radius:var(--radius-md); font-family:inherit; font-size:14px; color:var(--text); background:var(--navy-900); outline:none; transition:border-color 0.2s; }
    .field select option, .filter-sel option { background-color:#0E222A; color:#EDE6DA; }
    .field select option:checked, .filter-sel option:checked { background-color:#1D3B47; color:#E8873A; }
    .field input:focus, .field select:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(232,135,58,0.18); }
    .alert-err { background:rgba(248, 113, 113, 0.12); border:1px solid rgba(248, 113, 113, 0.35); color:#FCA5A5; padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:14px; }

    /* Actions */
    .actions-wrap { position:relative; }
    .actions-btn { border:none; background:transparent; cursor:pointer; padding:6px; border-radius:8px; color:var(--text-muted); display:flex; align-items:center; transition:background 0.15s; }
    .actions-btn:hover { background:var(--surface-subtle); color:var(--text); }
    .actions-menu { position:absolute; right:0; top:calc(100%+4px); z-index:50; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-lg); min-width:190px; overflow:hidden; }
    .actions-menu[hidden] { display:none; }
    .actions-menu button { display:flex; align-items:center; gap:10px; width:100%; padding:10px 16px; background:none; border:none; font-family:inherit; font-size:13.5px; color:var(--text); cursor:pointer; text-align:left; transition:background 0.12s; }
    .actions-menu button:hover { background:var(--surface-subtle); }
    .actions-menu button.danger { color:#EF4444; }
    .actions-menu button.danger:hover { background:rgba(248, 113, 113, 0.12); }
  </style>
</head>
<body>
<script type="module">
  import { requireSession, mountShell, toast, isSuperAdmin } from './assets/js/auth.js';
  import { api } from './assets/js/api.js';

  if (!requireSession()) throw new Error('redirect');
  mountShell({ title: 'Subscriptions & Payments' });
  const isSA = isSuperAdmin();

  const pg = document.getElementById('page');

  pg.innerHTML = `
    <div class="page-header-row">
      <div class="page-title">
        <h1>Subscriptions & Payments</h1>
        <p>Manage plans, verify transactions, and control renewals</p>
      </div>
      <button class="btn btn-primary" id="cash-pay-btn" ${isSA ? '' : 'hidden'}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Record Payment
      </button>
    </div>

    <!-- Tabs: Super Admin only -->
    <div class="tab-bar" ${isSA ? '' : 'hidden'}>
      <button class="tab-btn active" onclick="switchTab('plans',this)">Plans</button>
      <button class="tab-btn" onclick="switchTab('subscriptions',this)">Subscriptions</button>
      <button class="tab-btn" onclick="switchTab('payments',this)">Payments</button>
      <button class="tab-btn" onclick="switchTab('emails',this)">Email Logs</button>
    </div>

    <!-- Plans Tab: Super Admin only -->
    <div class="tab-content ${isSA ? 'active' : ''}" id="tab-plans" ${isSA ? '' : 'hidden'}>
      <div class="card" style="margin-bottom:16px">
        <div class="card-head" style="display:flex;justify-content:space-between;align-items:center">
          <h3>Manage plans</h3>
          <button class="btn btn-primary btn-sm" id="new-plan-btn">+ New plan</button>
        </div>
        <table>
          <thead><tr><th>Code</th><th>Name</th><th>Students</th><th>Branches</th><th>Users</th><th>Monthly ₹</th><th>Annual ₹</th><th>Status</th><th></th></tr></thead>
          <tbody id="admin-plan-tbody"><tr><td colspan="9" style="text-align:center;padding:24px;color:var(--text-muted)">Loading…</td></tr></tbody>
        </table>
        <p style="color:var(--text-muted);font-size:12px;margin-top:8px">-1 means unlimited. Changes to a plan's limits or prices apply to every academy on that plan straight away.</p>
      </div>
      <div class="plan-grid" id="plan-grid">
        ${[0,1,2].map(()=>`<div class="plan-card"><div class="skeleton" style="height:200px"></div></div>`).join('')}
      </div>
    </div>

    <!-- Subscriptions Tab: Super Admin only -->
    <div class="tab-content" id="tab-subscriptions" ${isSA ? '' : 'hidden'}>
      <div class="toolbar">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="sub-search" placeholder="Search academy…">
        </div>
        <select class="filter-sel" id="sub-status">
          <option value="">All Statuses</option>
          <option value="ACTIVE">Active</option>
          <option value="TRIAL">Trial</option>
          <option value="EXPIRED">Expired</option>
          <option value="CANCELLED">Cancelled</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Academy</th><th>Plan</th><th>Status</th><th>Billing</th><th>Start Date</th><th>Expires</th><th>Actions</th></tr></thead>
          <tbody id="sub-tbody"><tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted)">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- Payments Tab -->
    <div class="tab-content ${isSA ? '' : 'active'}" id="tab-payments">
      <div class="toolbar">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="pay-search" placeholder="Search academy or reference…">
        </div>
        <input type="date" lang="en-IN" class="filter-sel" id="pay-from" title="Paid from">
        <input type="date" lang="en-IN" class="filter-sel" id="pay-to" title="Paid to">
        <select class="filter-sel" id="pay-status">
          <option value="">All Statuses</option>
          <option value="COMPLETED">Verified</option>
          <option value="PENDING">Pending</option>
          <option value="FAILED">Failed</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Academy</th><th>Amount</th><th>Method</th><th>Reference</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
          <tbody id="pay-tbody"><tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted)">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- Email Logs Tab: Super Admin only -->
      <div class="tab-content" id="tab-emails" ${isSA ? '' : 'hidden'}>
      <div class="card" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <span style="color:var(--text-muted);font-size:13px">Receipts are sent to the academy's email. Failed or pending mail can be retried; payments are never recorded twice.</span>
        <button class="btn btn-ghost btn-sm" id="retry-email-btn">Retry pending &amp; failed</button>
      </div>
      <div class="card" style="padding:0">
        <table>
          <thead><tr><th>To</th><th>Subject</th><th>Reference</th><th>Status</th><th>Attempts</th><th>Last error</th><th>Created</th></tr></thead>
          <tbody id="email-tbody"><tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted)">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>

  <div class="modal-backdrop" id="plan-modal" hidden>
      <div class="modal-card">
        <div class="modal-head"><h3 id="plan-modal-title">New plan</h3></div>
        <div class="modal-body">
          <div class="alert-err" id="plan-err" hidden></div>
          <div class="field"><label>Code (letters only) *</label><input id="p-code" placeholder="COACHING"></div>
          <div class="field"><label>Name *</label><input id="p-name"></div>
          <div class="field"><label>Max students (-1 = unlimited) *</label><input id="p-students" type="number" value="50"></div>
          <div class="field"><label>Max branches *</label><input id="p-branches" type="number" value="1"></div>
          <div class="field"><label>Max users *</label><input id="p-users" type="number" value="5"></div>
          <div class="field"><label>Monthly price (₹) *</label><input id="p-monthly" type="number" min="0" value="499"></div>
          <div class="field"><label>Annual price (₹) *</label><input id="p-annual" type="number" min="0" value="4999"></div>
          <div class="field"><label>Sort order</label><input id="p-sort" type="number" value="0"></div>
          <div class="field"><label>Status</label>
            <select id="p-active"><option value="true">Active</option><option value="false">Inactive</option></select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="plan-cancel-btn">Cancel</button>
          <button class="btn btn-primary" id="plan-save-btn">Save plan</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="cash-modal" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <h3 id="payment-modal-title">💳 Record Payment</h3>
          <button class="modal-close" id="cash-close-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="alert-err" id="cash-err" hidden></div>
          <div class="field"><label>Academy *</label>
            <select id="c-org"><option value="">Select academy…</option></select>
          </div>
          <div class="field"><label>Plan *</label>
            <select id="c-plan"><option value="">Select plan…</option></select>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="field"><label>Amount (₹) *</label><input id="c-amt" type="number" placeholder="e.g. 2999"></div>
            <div class="field"><label>Months to Extend *</label>
              <select id="c-months">
                <option value="1">1 Month</option>
                <option value="3">3 Months</option>
                <option value="6">6 Months</option>
                <option value="12" selected>12 Months (Annual)</option>
              </select>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="field"><label>Payment Method *</label>
              <select id="c-method">
                <option value="CASH" selected>💵 Cash on Hand</option>
                <option value="UPI">📱 UPI (GPay / PhonePe / QR)</option>
                <option value="DIRECT_TRANSFER">🏦 Bank / Direct Transfer</option>
                <option value="CHEQUE">📄 Cheque / DD</option>
                <option value="OTHER">⚡ Other</option>
              </select>
            </div>
            <div class="field"><label>Payment Status *</label>
              <select id="c-status">
                <option value="COMPLETED" selected>✅ Completed</option>
                <option value="PENDING">⏳ Pending</option>
              </select>
            </div>
          </div>
          <div class="field"><label>Receipt / Reference No.</label><input id="c-ref" placeholder="e.g. CASH-2025-001 or UPI Ref / UTR"></div>
          <div class="field"><label>Notes</label><input id="c-note" placeholder="Any notes about this payment…"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="cash-cancel-btn">Cancel</button>
          <button class="btn btn-primary" id="cash-submit-btn">Record & Activate</button>
        </div>
      </div>
    </div>
  `;

  // Tab switching
  window.switchTab = function(name, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`tab-${name}`).classList.add('active');
    btn.classList.add('active');
  };

  // Load Plans
  let planData = [], orgData = [], subData = [], payData = [];
  try {
    planData = await api.plans();
    const pg2 = document.getElementById('plan-grid');
    const ICONS = ['🥋','🏆','⚡'];
    pg2.innerHTML = planData.map((p,i) => `
      <div class="plan-card ${i===1?'featured':''}">
        ${i===1?'<div class="featured-badge">Popular</div>':''}
        <div style="font-size:28px;margin-bottom:10px">${ICONS[i]||'📦'}</div>
        <div class="plan-name">${p.name}</div>
        <div class="plan-price">₹${p.price_monthly?.toLocaleString('en-IN')}<span>/month</span></div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px">₹${p.price_annual?.toLocaleString('en-IN')}/year</div>
        <ul class="plan-features">
          <li><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Up to ${p.max_students} students</li>
          <li><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>${p.max_branches} branch${p.max_branches>1?'es':''}</li>
          <li><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>${p.max_users} admin user${p.max_users>1?'s':''}</li>
        </ul>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <span class="badge badge-gray" style="font-size:10px">${p.code}</span>
          <span class="badge ${p.is_active?'badge-green':'badge-red'}">${p.is_active?'Active':'Inactive'}</span>
        </div>
      </div>
    `).join('') || '<p style="color:var(--text-muted)">No plans configured.</p>';
  } catch(e) { document.getElementById('plan-grid').innerHTML = `<p style="color:var(--text-muted)">Could not load plans: ${e.message}</p>`; }

  // Load Orgs for subscriptions tab
  try {
    const res = await api.listOrganizations();
    orgData = res?.organizations || [];

    // Populate org dropdown for cash modal
    const orgSel = document.getElementById('c-org');
    const planSel = document.getElementById('c-plan');
    orgData.forEach(o => {
      orgSel.insertAdjacentHTML('beforeend', `<option value="${o.id}">${o.name}</option>`);
    });
    // Populate plan dropdown in cash modal using loaded planData
    if (planData.length) {
      planData.forEach(p => {
        planSel.insertAdjacentHTML('beforeend', `<option value="${p.code}">${p.name} (${p.code})</option>`);
      });
    }

    // Build subscriptions data from orgs
    subData = orgData.filter(o => o.subscription);
    renderSubs();
  } catch(e) { document.getElementById('sub-tbody').innerHTML = `<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted)">Failed to load: ${e.message}</td></tr>`; }

  // Load Payments
  try {
    payData = await api.listPayments().catch(() => []);
    renderPayments();
  } catch(e) { /* no payments */ }

  function renderSubs() {
    const q = document.getElementById('sub-search').value.toLowerCase();
    const sf = document.getElementById('sub-status').value;
    const rows = subData.filter(o => {
      // backend returns flat fields: subscription_status
      if (sf && o.subscription_status !== sf) return false;
      return !q || o.name.toLowerCase().includes(q);
    });
    const tbody = document.getElementById('sub-tbody');
    tbody.innerHTML = rows.map(o => {
      const subSt  = o.subscription_status || 'NONE';
      const cls = subSt==='ACTIVE'?'badge-green':subSt==='TRIAL'?'badge-blue':subSt==='EXPIRED'?'badge-red':'badge-amber';
      const plan = (o.plan_code && o.plan_code !== 'NONE') ? o.plan_code : '—';
      return `<tr>
        <td><strong>${o.name}</strong></td>
        <td><span class="badge badge-blue">${plan}</span></td>
        <td><span class="badge ${cls}">${subSt}</span></td>
        <td>MONTHLY</td>
        <td>—</td>
        <td>—</td>
        <td>
          <div class="actions-wrap">
            <button class="actions-btn" onclick="toggleSubMenu('${o.id}',this)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
            </button>
            <div class="actions-menu" id="smenu-${o.id}" hidden>
              <button onclick="extendSub('${o.id}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.91-5.54"/></svg>
                Extend Subscription
              </button>
              <button onclick="openCashForOrg('${o.id}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                Record Payment
              </button>
              <button class="danger" onclick="cancelSub('${o.id}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                Cancel Subscription
              </button>
            </div>
          </div>
        </td>
      </tr>`;
    }).join('') || `<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted)">No subscriptions found</td></tr>`;
  }

  function renderPayments() {
    const q = document.getElementById('pay-search').value.toLowerCase();
    const pf = document.getElementById('pay-status').value;
    const from = document.getElementById('pay-from').value;
    const to = document.getElementById('pay-to').value;
    const rows = payData.filter(p => {
      if (pf && p.status !== pf) return false;
      const day = p.paid_at ? p.paid_at.slice(0, 10) : '';
      if (from && (!day || day < from)) return false;
      if (to && (!day || day > to)) return false;
      const txt = `${p.organization_name||''} ${p.payment_reference||''}`.toLowerCase();
      return !q || txt.includes(q);
    });
    const tbody = document.getElementById('pay-tbody');
    tbody.innerHTML = rows.map(p => {
      const cls = (p.status==='COMPLETED'||p.status==='VERIFIED')?'badge-green':p.status==='PENDING'?'badge-amber':'badge-red';
      const methodLabels = {
        cash: '💵 Cash on Hand',
        cash_on_hand: '💵 Cash on Hand',
        upi: '📱 UPI',
        direct_transfer: '🏦 Bank Transfer',
        bank_transfer: '🏦 Bank Transfer',
        cheque: '📄 Cheque',
        razorpay: '💳 Razorpay',
        offline: '💵 Cash on Hand',
      };
      const method = methodLabels[p.gateway?.toLowerCase()] || p.gateway || 'Cash';
      const statusLabel = (p.status==='COMPLETED'||p.status==='VERIFIED') ? 'Completed' : (p.status==='PENDING' ? 'Pending' : p.status);
      return `<tr>
        <td><strong>${p.organization_name||p.organization_id}</strong></td>
        <td><strong>₹${p.amount?.toLocaleString('en-IN')}</strong></td>
        <td><span class="badge badge-gray">${method}</span></td>
        <td style="font-family:monospace;font-size:12px">${p.receipt_number||p.payment_reference||'—'}</td>
        <td><span class="badge ${cls}">${statusLabel}</span></td>
        <td>${p.paid_at?new Date(p.paid_at).toLocaleDateString('en-IN'):'—'}</td>
        <td>
          ${(p.status==='PENDING' && isSA)?`<button class="btn btn-ghost btn-sm" onclick="verifyPay('${p.id}')">Verify</button>`:'—'}
        </td>
      </tr>`;
    }).join('') || `<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted)">No payment records</td></tr>`;
  }

  // Email logs
  let emailData = [];
  async function loadEmails() {
    emailData = await api.listEmailLogs().catch(() => []);
    const tbody = document.getElementById('email-tbody');
    tbody.innerHTML = emailData.map(e => {
      const cls = e.status==='SENT'?'badge-green':e.status==='PENDING'?'badge-amber':'badge-red';
      return `<tr>
        <td>${e.recipient || '—'}</td>
        <td>${e.subject}</td>
        <td style="font-family:monospace;font-size:12px">${e.reference || '—'}</td>
        <td><span class="badge ${cls}">${e.status}</span></td>
        <td>${e.attempts}</td>
        <td style="font-size:12px;color:var(--text-muted)">${e.last_error || '—'}</td>
        <td>${e.created_at ? new Date(e.created_at).toLocaleString('en-IN') : '—'}</td>
      </tr>`;
    }).join('') || `<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted)">No emails yet</td></tr>`;
  }
  document.getElementById('retry-email-btn').addEventListener('click', async (e) => {
    e.target.disabled = true;
    try {
      const r = await api.retryEmails();
      toast(`Sent ${r.sent} of ${r.attempted} email(s)`, 'success');
      await loadEmails();
    } catch (err) { toast(err.message, 'error'); }
    finally { e.target.disabled = false; }
  });
  loadEmails();

  // Plan management (Super Admin)
  let adminPlans = [];
  let editingPlanId = null;
  async function loadAdminPlans() {
    adminPlans = await api.adminPlans().catch(() => []);
    document.getElementById('admin-plan-tbody').innerHTML = adminPlans.map(p => `<tr>
      <td style="font-family:monospace">${p.code}</td>
      <td>${p.name}</td>
      <td>${p.max_students}</td><td>${p.max_branches}</td><td>${p.max_users}</td>
      <td>${p.price_monthly}</td><td>${p.price_annual}</td>
      <td><span class="badge ${p.is_active ? 'badge-green' : 'badge-gray'}">${p.is_active ? 'Active' : 'Inactive'}</span></td>
      <td><button class="btn btn-ghost btn-sm" onclick="editPlan('${p.id}')">Edit</button></td>
    </tr>`).join('') || `<tr><td colspan="9" style="text-align:center;padding:24px;color:var(--text-muted)">No plans</td></tr>`;
  }
  function openPlanModal(plan) {
    editingPlanId = plan ? plan.id : null;
    document.getElementById('plan-err').hidden = true;
    document.getElementById('plan-modal-title').textContent = plan ? `Edit ${plan.code}` : 'New plan';
    const codeField = document.getElementById('p-code');
    codeField.value = plan ? plan.code : '';
    codeField.disabled = !!plan;
    document.getElementById('p-name').value = plan ? plan.name : '';
    document.getElementById('p-students').value = plan ? plan.max_students : 50;
    document.getElementById('p-branches').value = plan ? plan.max_branches : 1;
    document.getElementById('p-users').value = plan ? plan.max_users : 5;
    document.getElementById('p-monthly').value = plan ? plan.price_monthly : 499;
    document.getElementById('p-annual').value = plan ? plan.price_annual : 4999;
    document.getElementById('p-sort').value = plan ? plan.sort_order : 0;
    document.getElementById('p-active').value = plan && !plan.is_active ? 'false' : 'true';
    document.getElementById('plan-modal').hidden = false;
  }
  window.editPlan = (id) => openPlanModal(adminPlans.find(p => p.id === id));
  document.getElementById('new-plan-btn').addEventListener('click', () => openPlanModal(null));
  document.getElementById('plan-cancel-btn').addEventListener('click', () => document.getElementById('plan-modal').hidden = true);
  document.getElementById('plan-save-btn').addEventListener('click', async () => {
    const err = document.getElementById('plan-err');
    const body = {
      name: document.getElementById('p-name').value.trim(),
      max_students: parseInt(document.getElementById('p-students').value),
      max_branches: parseInt(document.getElementById('p-branches').value),
      max_users: parseInt(document.getElementById('p-users').value),
      price_monthly: parseFloat(document.getElementById('p-monthly').value),
      price_annual: parseFloat(document.getElementById('p-annual').value),
      sort_order: parseInt(document.getElementById('p-sort').value) || 0,
      is_active: document.getElementById('p-active').value === 'true',
    };
    try {
      if (editingPlanId) {
        await api.updatePlan(editingPlanId, body);
      } else {
        await api.createPlan({ ...body, code: document.getElementById('p-code').value.trim() });
      }
      document.getElementById('plan-modal').hidden = true;
      toast('Plan saved', 'success');
      await loadAdminPlans();
    } catch (e) {
      err.textContent = e.message;
      err.hidden = false;
    }
  });
  loadAdminPlans();

  // Event listeners for filters
  ['sub-search','sub-status'].forEach(id => document.getElementById(id).addEventListener('input', renderSubs));
  ['sub-search','sub-status'].forEach(id => document.getElementById(id).addEventListener('change', renderSubs));
  ['pay-search','pay-status','pay-from','pay-to'].forEach(id => document.getElementById(id).addEventListener('input', renderPayments));
  ['pay-search','pay-status','pay-from','pay-to'].forEach(id => document.getElementById(id).addEventListener('change', renderPayments));

  // Global actions
  window.toggleSubMenu = function(id, btn) {
    document.querySelectorAll('.actions-menu').forEach(m => { if (m.id!==`smenu-${id}`) m.hidden=true; });
    const m = document.getElementById(`smenu-${id}`);
    m.hidden = !m.hidden;
  };
  document.addEventListener('click', e => {
    if (!e.target.closest('.actions-wrap')) document.querySelectorAll('.actions-menu').forEach(m => m.hidden=true);
  });

  window.extendSub = function(id) {
    document.querySelectorAll('.actions-menu').forEach(m => m.hidden=true);
    openCashForOrg(id);
  };

  window.openCashForOrg = function(id) {
    document.querySelectorAll('.actions-menu').forEach(m => m.hidden=true);
    document.getElementById('c-org').value = id;
    document.getElementById('cash-modal').hidden = false;
  };

  window.cancelSub = async function(id) {
    document.querySelectorAll('.actions-menu').forEach(m => m.hidden=true);
    if (!confirm('Cancel this subscription? The academy will lose access.')) return;
    try {
      await api.updateOrgPlan(id, { action: 'cancel' });
      toast('Subscription cancelled', 'success');
      const res = await api.listOrganizations();
      orgData = res?.organizations || [];
      subData = orgData.filter(o=>o.subscription);
      renderSubs();
    } catch(e) { toast(e.message, 'error'); }
  };

  window.verifyPay = async function(id) {
    if (!confirm('Mark this payment as COMPLETED and activate / extend the academy subscription?')) return;
    try {
      await api.verifyPayment(id);
      toast('Payment verified and subscription activated!', 'success');
      payData = await api.listPayments().catch(() => []);
      renderPayments();
      if (isSA) {
        const res = await api.listOrganizations().catch(() => ({ organizations: [] }));
        orgData = res?.organizations || [];
        subData = orgData.filter(o => o.subscription);
        renderSubs();
      }
    } catch(e) {
      toast(e.message, 'error');
    }
  };

  // Payment Modal UI & Events
  const methodSel = document.getElementById('c-method');
  const statusSel = document.getElementById('c-status');
  const refInput  = document.getElementById('c-ref');
  const submitBtn = document.getElementById('cash-submit-btn');

  statusSel?.addEventListener('change', () => {
    if (statusSel.value === 'PENDING') {
      submitBtn.textContent = 'Record as Pending';
    } else {
      submitBtn.textContent = 'Record & Activate';
    }
  });

  methodSel?.addEventListener('change', () => {
    const v = methodSel.value;
    if (v === 'UPI') refInput.placeholder = 'e.g. UPI Ref / UTR / Transaction ID';
    else if (v === 'DIRECT_TRANSFER') refInput.placeholder = 'e.g. IMPS / NEFT Ref / UTR';
    else if (v === 'CHEQUE') refInput.placeholder = 'e.g. Cheque No. / Bank Name';
    else refInput.placeholder = 'e.g. CASH-2025-001';
  });

  document.getElementById('cash-pay-btn')?.addEventListener('click', () => {
    document.getElementById('cash-modal').hidden = false;
  });
  ['cash-close-btn','cash-cancel-btn'].forEach(id => {
    document.getElementById(id)?.addEventListener('click', () => document.getElementById('cash-modal').hidden = true);
  });

  submitBtn?.addEventListener('click', async () => {
    const err = document.getElementById('cash-err');
    const orgId   = document.getElementById('c-org').value;
    const amount  = parseFloat(document.getElementById('c-amt').value);
    const months  = parseInt(document.getElementById('c-months').value);
    const mode    = document.getElementById('c-method').value;
    const status  = document.getElementById('c-status').value;
    const ref     = document.getElementById('c-ref').value.trim();
    const notes   = document.getElementById('c-note').value.trim();

    if (!orgId) { err.textContent='Please select an academy.'; err.hidden=false; return; }
    if (!amount || amount <= 0) { err.textContent='Enter a valid amount.'; err.hidden=false; return; }

    submitBtn.disabled=true;
    submitBtn.textContent='Processing…';
    try {
      const planCode = document.getElementById('c-plan')?.value || 'starter';
      await api.recordOfflinePayment({
        organization_id: orgId,
        plan_code: planCode,
        amount,
        duration_months: months,
        payment_mode: mode,
        status: status,
        receipt_number: ref || undefined,
        notes: notes || undefined,
      });
      toast(status === 'COMPLETED' ? 'Payment recorded & subscription activated!' : 'Payment recorded as Pending.', 'success');
      document.getElementById('cash-modal').hidden = true;
      payData = await api.listPayments().catch(() => []);
      renderPayments();
      if (isSA) {
        const res = await api.listOrganizations().catch(() => ({ organizations: [] }));
        orgData = res?.organizations || [];
        subData = orgData.filter(o=>o.subscription);
        renderSubs();
      }
    } catch(e) {
      err.textContent = e.message;
      err.hidden = false;
    } finally {
      submitBtn.disabled=false;
      submitBtn.textContent = (document.getElementById('c-status')?.value === 'PENDING') ? 'Record as Pending' : 'Record & Activate';
    }
  });
</script>
</body>
</html>
