<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers & Users · Vagai Silambam</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .page-header-row {
      display:flex; align-items:flex-start; justify-content:space-between;
      gap:16px; margin-bottom:24px; flex-wrap:wrap;
    }
    .page-title h1 { font-size:22px; font-weight:800; color:var(--text); letter-spacing:-0.4px; }
    .page-title p  { font-size:13.5px; color:var(--text-muted); margin-top:3px; }

    .toolbar {
      display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; align-items:center;
    }
    .search-box {
      display:flex; align-items:center; gap:8px;
      background:var(--surface); border:1.5px solid var(--border);
      border-radius:var(--radius-md); padding:8px 14px; flex:1; min-width:220px;
    }
    .search-box input {
      border:none; outline:none; font-family:inherit; font-size:13.5px;
      color:var(--text); background:transparent; flex:1;
    }
    .search-box svg { color:var(--text-muted); flex-shrink:0; }

    select.filter-sel {
      padding:8px 14px; border:1.5px solid var(--border); border-radius:var(--radius-md);
      font-family:inherit; font-size:13px; color:var(--text);
      background:var(--surface); outline:none; cursor:pointer;
    }

    .table-wrap {
      overflow-x:auto; border-radius:var(--radius-lg); border:1px solid var(--border);
      background:var(--surface); box-shadow:var(--shadow-xs);
    }
    table { width:100%; border-collapse:collapse; }
    thead th {
      background:var(--surface-subtle); padding:11px 16px;
      font-size:11px; font-weight:800; text-transform:uppercase;
      letter-spacing:0.6px; color:var(--text-muted); text-align:left;
      border-bottom:1px solid var(--border); white-space:nowrap;
    }
    tbody td {
      padding:12px 16px; font-size:13.5px; color:var(--text);
      border-bottom:1px solid var(--border-light); vertical-align:middle;
    }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr:hover td { background:rgba(255, 255, 255, 0.03); }

    .badge {
      display:inline-flex; align-items:center; gap:4px; padding:3px 9px;
      border-radius:6px; font-size:11.5px; font-weight:700;
    }
    .badge-green  { background:rgba(52, 211, 153, 0.12); color:#6EE7B7; }
    .badge-red    { background:rgba(248, 113, 113, 0.12); color:#FCA5A5; }
    .badge-amber  { background:rgba(251, 191, 36, 0.12); color:#FCD34D; }
    .badge-blue   { background:rgba(57, 195, 239, 0.12); color:#7DD3FC; }
    .badge-gray   { background:rgba(255, 255, 255, 0.06); color:#C8C8C8; }
    .badge-violet { background:rgba(139, 92, 246, 0.14); color:#C4B5FD; }

    .avatar {
      width:34px; height:34px; border-radius:10px;
      background:linear-gradient(135deg,#39C3EF,#1E3A8A);
      display:grid; place-items:center; font-size:14px; font-weight:800;
      color:#fff; flex-shrink:0;
    }

    .org-cell { display:flex; align-items:center; gap:10px; }
    .org-info .name { font-weight:700; }
    .org-info .sub  { font-size:12px; color:var(--text-muted); }

    /* Actions menu */
    .actions-wrap { position:relative; }
    .actions-btn {
      border:none; background:transparent; cursor:pointer; padding:6px;
      border-radius:8px; color:var(--text-muted); display:flex; align-items:center;
      transition:background 0.15s;
    }
    .actions-btn:hover { background:var(--surface-subtle); color:var(--text); }
    .actions-menu {
      position:absolute; right:0; top:calc(100%+4px); z-index:50;
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius-md); box-shadow:var(--shadow-lg);
      min-width:190px; overflow:hidden;
    }
    .actions-menu[hidden] { display:none; }
    .actions-menu button {
      display:flex; align-items:center; gap:10px; width:100%;
      padding:10px 16px; background:none; border:none; font-family:inherit;
      font-size:13.5px; color:var(--text); cursor:pointer; text-align:left;
      transition:background 0.12s;
    }
    .actions-menu button:hover { background:var(--surface-subtle); }
    .actions-menu button.danger { color:#EF4444; }
    .actions-menu button.danger:hover { background:rgba(248, 113, 113, 0.12); }
    .actions-menu hr { margin:4px 0; border:none; border-top:1px solid var(--border-light); }

    /* Modal */
    .modal-backdrop {
      position:fixed; inset:0; background:rgba(10,19,36,0.55);
      backdrop-filter:blur(4px); z-index:200;
      display:grid; place-items:center; padding:20px;
    }
    .modal-backdrop[hidden] { display:none; }
    .modal-card {
      width:100%; max-width:500px; background:var(--surface); border-radius:var(--radius-xl);
      border:1px solid var(--border); box-shadow:0 24px 60px rgba(10,19,36,0.25);
      overflow:hidden; animation:slideUp 0.3s cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
    .modal-head {
      padding:18px 24px; background:var(--surface-subtle);
      border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
    }
    .modal-head h3 { font-size:16px; font-weight:800; }
    .modal-close { border:none; background:none; cursor:pointer; color:var(--text-muted); padding:4px; border-radius:8px; }
    .modal-close:hover { background:var(--border); }
    .modal-body { padding:24px; }
    .modal-footer { padding:16px 24px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; }

    .field { margin-bottom:16px; }
    .field label { display:block; font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px; }
    .field input, .field select {
      width:100%; padding:10px 14px; border:1.5px solid var(--border);
      border-radius:var(--radius-md); font-family:inherit; font-size:14px;
      color:var(--text); background:rgba(255, 255, 255, 0.04); outline:none; transition:border-color 0.2s;
    }
    .field input:focus, .field select:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,0.1); }
    .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

    .alert-err {
      background:rgba(248, 113, 113, 0.12); border:1px solid rgba(248, 113, 113, 0.35); color:#FCA5A5;
      padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:14px;
    }
  </style>
</head>
<body>
<script type="module">
  import { requireSession, mountShell, toast, isSuperAdmin } from './assets/js/auth.js';
  import { api } from './assets/js/api.js';

  if (!requireSession()) throw new Error('redirect');
  mountShell({ title: 'Customers & Users' });

  const pg = document.getElementById('page');

  pg.innerHTML = `
    <div class="page-header-row">
      <div class="page-title">
        <h1>Customers & Users</h1>
        <p>Manage registered academies, users and access roles</p>
      </div>
      <button class="btn btn-primary" id="add-org-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Customer
      </button>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" placeholder="Search academies, emails…">
      </div>
      <select class="filter-sel" id="status-filter">
        <option value="">All Statuses</option>
        <option value="ACTIVE">Active</option>
        <option value="SUSPENDED">Suspended</option>
      </select>
      <select class="filter-sel" id="plan-filter">
        <option value="">All Plans</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Academy</th>
            <th>Email / Phone</th>
            <th>Plan</th>
            <th>Status</th>
            <th>Subscription</th>
            <th>Users</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="org-tbody">
          <tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted)">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Add Customer Modal -->
    <div class="modal-backdrop" id="add-modal" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <h3>Add New Customer</h3>
          <button class="modal-close" id="modal-close-btn" title="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="alert-err" id="modal-err" hidden></div>
          <p style="font-size:13px;color:var(--text-muted);margin-bottom:18px">Create an academy account. An admin user for this academy will be created with the credentials below.</p>
          <div class="field"><label>Academy Name *</label><input id="m-org" placeholder="e.g. Chennai Silambam Academy"></div>
          <div class="field-grid">
            <div class="field"><label>Admin Username *</label><input id="m-uname" placeholder="username"></div>
            <div class="field"><label>Password *</label><input id="m-pass" type="password" placeholder="min 8 chars"></div>
          </div>
          <div class="field-grid">
            <div class="field"><label>Full Name *</label><input id="m-name" placeholder="Admin's full name"></div>
            <div class="field"><label>Email *</label><input id="m-email" type="email" placeholder="admin@academy.com"></div>
          </div>
          <div class="field-grid">
            <div class="field"><label>Phone</label><input id="m-phone" placeholder="+91 98765 43210"></div>
            <div class="field"><label>Plan</label>
              <select id="m-plan">
                <option value="">Select plan…</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="modal-cancel-btn">Cancel</button>
          <button class="btn btn-primary" id="modal-submit-btn">Create Account</button>
        </div>
      </div>
    </div>

    <!-- Reset Password Modal -->
    <div class="modal-backdrop" id="reset-modal" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <h3>Reset Password</h3>
          <button class="modal-close" id="reset-close-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="alert-err" id="reset-err" hidden></div>
          <div class="field"><label>New Password *</label><input id="r-pass" type="password" placeholder="Minimum 8 characters"></div>
          <div class="field"><label>Confirm Password *</label><input id="r-pass2" type="password" placeholder="Repeat password"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="reset-cancel-btn">Cancel</button>
          <button class="btn btn-primary" id="reset-submit-btn">Reset Password</button>
        </div>
      </div>
    </div>
  `;

  let orgData = [];
  let planData = [];
  let selectedOrgId = null;

  // Load plans
  try {
    const plans = await api.plans();
    planData = plans || [];
    const planSel = document.getElementById('plan-filter');
    const mPlan = document.getElementById('m-plan');
    planData.forEach(p => {
      planSel.insertAdjacentHTML('beforeend', `<option value="${p.code}">${p.name}</option>`);
      mPlan.insertAdjacentHTML('beforeend', `<option value="${p.id}">${p.name} — ₹${p.price_monthly}/mo</option>`);
    });
  } catch(e) { /* plans optional */ }

  // Load organizations
  async function loadOrgs() {
    try {
      const res = await api.listOrganizations();
      orgData = res?.organizations || [];
      renderTable();
    } catch(e) {
      toast('Failed to load customers: ' + e.message, 'error');
    }
  }

  function renderTable() {
    const q = document.getElementById('search').value.toLowerCase();
    const statusF = document.getElementById('status-filter').value;
    const planF = document.getElementById('plan-filter').value;

    let rows = orgData.filter(o => {
      if (statusF && o.status !== statusF) return false;
      // backend returns flat field: plan_code
      if (planF && o.plan_code !== planF) return false;
      const text = `${o.name} ${o.email||''} ${o.organization_code||''}`.toLowerCase();
      return !q || text.includes(q);
    });

    const tbody = document.getElementById('org-tbody');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted)">No customers found</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(o => {
      const status = o.status === 'ACTIVE'
        ? `<span class="badge badge-green">Active</span>`
        : `<span class="badge badge-red">Suspended</span>`;
      // Backend returns flat fields: plan_code, subscription_status (not nested subscription obj)
      const subStatus = o.subscription_status || 'NONE';
      let subBadge = `<span class="badge badge-gray">No Plan</span>`;
      if (subStatus && subStatus !== 'NONE') {
        const cls = subStatus==='ACTIVE'?'badge-green':subStatus==='TRIAL'?'badge-blue':subStatus==='EXPIRED'?'badge-red':'badge-amber';
        subBadge = `<span class="badge ${cls}">${subStatus}</span>`;
      }
      const plan = (o.plan_code && o.plan_code !== 'NONE') ? o.plan_code : '—';
      const letter = (o.name||'A').charAt(0).toUpperCase();
      const students = o.active_students ?? '—';

      return `<tr>
        <td>
          <div class="org-cell">
            <div class="avatar">${letter}</div>
            <div class="org-info">
              <div class="name">${o.name}</div>
              <div class="sub">${o.organization_code}</div>
            </div>
          </div>
        </td>
        <td>${o.email||'—'}<br><small style="color:var(--text-muted)">${o.phone||''}</small></td>
        <td><span class="badge badge-blue">${plan}</span></td>
        <td>${status}</td>
        <td>${subBadge}</td>
        <td><span class="badge badge-gray">${students}</span></td>
        <td>
          <div class="actions-wrap">
            <button class="actions-btn" onclick="toggleMenu('${o.id}',this)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
            </button>
            <div class="actions-menu" id="menu-${o.id}" hidden>
              <button onclick="openResetPwd('${o.id}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Reset Password
              </button>
              <button onclick="changePlan('${o.id}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                Change Plan
              </button>
              <hr>
              ${o.status==='ACTIVE'
                ? `<button class="danger" onclick="toggleOrg('${o.id}','suspend')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>Suspend Account</button>`
                : `<button onclick="toggleOrg('${o.id}','activate')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>Activate Account</button>`
              }
            </div>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  await loadOrgs();

  // Search & filter listeners
  ['search','status-filter','plan-filter'].forEach(id => {
    document.getElementById(id).addEventListener('input', renderTable);
    document.getElementById(id).addEventListener('change', renderTable);
  });

  // Global menu toggle
  window.toggleMenu = function(id, btn) {
    document.querySelectorAll('.actions-menu').forEach(m => {
      if (m.id !== `menu-${id}`) m.hidden = true;
    });
    const menu = document.getElementById(`menu-${id}`);
    menu.hidden = !menu.hidden;
  };
  document.addEventListener('click', e => {
    if (!e.target.closest('.actions-wrap')) {
      document.querySelectorAll('.actions-menu').forEach(m => m.hidden = true);
    }
  });

  // Suspend / Activate
  window.toggleOrg = async function(id, action) {
    document.querySelectorAll('.actions-menu').forEach(m => m.hidden = true);
    try {
      if (action === 'suspend') await api.suspendOrg(id);
      else await api.activateOrg(id);
      toast(`Academy ${action}d successfully`, 'success');
      await loadOrgs();
    } catch(e) { toast(e.message, 'error'); }
  };

  // Reset Password modal
  window.openResetPwd = function(id) {
    selectedOrgId = id;
    document.querySelectorAll('.actions-menu').forEach(m => m.hidden = true);
    document.getElementById('reset-modal').hidden = false;
  };
  ['reset-close-btn','reset-cancel-btn'].forEach(id => {
    document.getElementById(id).addEventListener('click', () => {
      document.getElementById('reset-modal').hidden = true;
    });
  });
  document.getElementById('reset-submit-btn').addEventListener('click', async () => {
    const p1 = document.getElementById('r-pass').value;
    const p2 = document.getElementById('r-pass2').value;
    const err = document.getElementById('reset-err');
    if (p1.length < 8) { err.textContent = 'Password must be at least 8 characters.'; err.hidden = false; return; }
    if (p1 !== p2) { err.textContent = 'Passwords do not match.'; err.hidden = false; return; }
    try {
      await api.resetAcademyAdminPassword(selectedOrgId, p1);
      toast('Password reset successfully', 'success');
      document.getElementById('reset-modal').hidden = true;
    } catch(e) { err.textContent = e.message; err.hidden = false; }
  });

  // Change plan
  window.changePlan = async function(id) {
    document.querySelectorAll('.actions-menu').forEach(m => m.hidden = true);
    const planCode = prompt('Enter new plan code (e.g. starter, professional, enterprise):');
    if (!planCode) return;
    try {
      await api.updateOrgPlan(id, { plan_code: planCode });
      toast('Plan updated successfully', 'success');
      await loadOrgs();
    } catch(e) { toast(e.message, 'error'); }
  };

  // Add Customer Modal
  document.getElementById('add-org-btn').addEventListener('click', () => {
    document.getElementById('add-modal').hidden = false;
  });
  ['modal-close-btn','modal-cancel-btn'].forEach(id => {
    document.getElementById(id).addEventListener('click', () => {
      document.getElementById('add-modal').hidden = true;
    });
  });
  document.getElementById('modal-submit-btn').addEventListener('click', async () => {
    const err = document.getElementById('modal-err');
    const btn = document.getElementById('modal-submit-btn');
    const org  = document.getElementById('m-org').value.trim();
    const uname= document.getElementById('m-uname').value.trim();
    const pass = document.getElementById('m-pass').value;
    const name = document.getElementById('m-name').value.trim();
    const email= document.getElementById('m-email').value.trim();
    const phone= document.getElementById('m-phone').value.trim();
    const plan = document.getElementById('m-plan').value;

    if (!org||!uname||!pass||!name||!email) { err.textContent='All required fields must be filled.'; err.hidden=false; return; }
    if (pass.length < 8) { err.textContent='Password must be at least 8 characters.'; err.hidden=false; return; }

    btn.disabled = true; btn.textContent = 'Creating…';
    try {
      // Backend RegisterRequest: organization_name, full_name_en, email, username, password, phone
      await api.register({
        organization_name: org,
        username: uname,
        password: pass,
        full_name_en: name,
        email,
        phone: phone || undefined,
        // plan_id not supported by public register endpoint; use admin API after creation
      });
      toast(`Academy "${org}" created successfully!`, 'success');
      document.getElementById('add-modal').hidden = true;
      await loadOrgs();
    } catch(e) {
      err.textContent = e.message;
      err.hidden = false;
    } finally {
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  });
</script>
</body>
</html>
