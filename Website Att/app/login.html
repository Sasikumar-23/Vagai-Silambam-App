<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Vagai Silambam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy-950: #070D1E;
      --navy-900: #0B162C;
      --navy-800: #162B52;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --primary-glow: rgba(37,99,235,0.35);
      --success: #10B981;
      --danger: #EF4444;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --surface: #FFFFFF;
      --bg: #F0F4FF;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #070D1E 0%, #0B162C 40%, #1a2a5e 100%);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: var(--text);
    }

    /* Animated background dots */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    /* Glow orbs */
    body::after {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(37,99,235,0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      padding: 44px 40px;
      box-shadow: 0 32px 80px rgba(7,13,30,0.5), 0 0 0 1px rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      margin: 24px;
      animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--navy-800), var(--primary));
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px var(--primary-glow);
    }

    .brand h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--navy-900);
      letter-spacing: -0.4px;
    }

    .brand p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Role selector tabs */
    .role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 28px;
      background: #F1F5F9;
      padding: 5px;
      border-radius: 14px;
    }

    .role-tab {
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .role-tab.active {
      background: var(--surface);
      color: var(--navy-900);
      box-shadow: 0 2px 8px rgba(15,23,42,0.1);
    }

    .role-tab svg { flex-shrink: 0; }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--navy-900);
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: #FAFBFF;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
      background: #fff;
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--primary), #1D4ED8);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      margin-top: 8px;
    }

    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 24px var(--primary-glow); }
    .btn-login:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

    /* Shimmer sweep */
    .btn-login::after {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transition: left 0.5s ease;
    }
    .btn-login:hover::after { left: 150%; }

    .alert-error {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #991B1B;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .role-badge.superadmin { background: #1E3A6E; color: #93C5FD; }
    .role-badge.admin { background: #064E3B; color: #6EE7B7; }

    .footer-text {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 24px;
    }

    .footer-text a { color: var(--primary); font-weight: 600; cursor: pointer; text-decoration: none; }
    .footer-text a:hover { text-decoration: underline; }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -8px;
      margin-bottom: 16px;
    }
    .forgot-link {
      font-size: 12.5px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .forgot-link:hover { text-decoration: underline; }

    /* Modal Backdrop & Card */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(7, 13, 30, 0.65);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .modal-backdrop[hidden] { display: none; }
    .modal-card {
      width: 100%;
      max-width: 400px;
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.3);
      overflow: hidden;
      animation: slideUp 0.3s ease;
    }
    .modal-head {
      padding: 18px 22px;
      background: #F8FAFC;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-head h3 { font-size: 16px; font-weight: 800; color: var(--navy-900); }
    .modal-close {
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      border-radius: 8px;
    }
    .modal-close:hover { background: var(--border); }
    .modal-body { padding: 22px; }
    .modal-footer {
      padding: 14px 22px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      background: #FAFBFF;
    }
    .btn-secondary {
      padding: 10px 16px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
    }
    .btn-secondary:hover { background: #F1F5F9; }
    .btn-primary-sm {
      padding: 10px 18px;
      border: none;
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary-sm:hover { background: var(--primary-hover); }
    .btn-primary-sm:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-logo">🥋</div>
      <h1>Vagai Silambam</h1>
      <p>Academy Management Portal</p>
    </div>

    <!-- Role Tabs -->
    <div class="role-tabs">
      <button class="role-tab active" id="tab-superadmin" onclick="switchRole('superadmin')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        Super Admin
      </button>
      <button class="role-tab" id="tab-admin" onclick="switchRole('admin')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a6 6 0 0 1 12 0v2"/></svg>
        Admin
      </button>
    </div>

    <div id="role-indicator" class="role-badge superadmin">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <span id="role-label">Super Admin Access</span>
    </div>

    <div class="alert-error" id="error" style="display:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="error-msg">Invalid credentials.</span>
    </div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" placeholder="Enter your username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>

      <div class="forgot-row">
        <a class="forgot-link" id="open-reset-btn">Forgot or reset password?</a>
      </div>

      <button class="btn-login" type="submit" id="submit-btn">Sign In</button>
    </form>

    <p class="footer-text">Vagai Silambam SaaS &copy; 2025 · DTLP Technologies</p>
  </div>

  <!-- Reset Password Modal -->
  <div class="modal-backdrop" id="reset-modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3>Reset Password</h3>
        <button class="modal-close" id="reset-close-btn" title="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="alert-error" id="reset-err" style="display:none">
          <span id="reset-err-msg"></span>
        </div>
        <div class="field">
          <label for="r-username">Username or Email *</label>
          <input id="r-username" placeholder="e.g. sasikumar or superadmin" required>
        </div>
        <div class="field">
          <label for="r-pass">New Password *</label>
          <input id="r-pass" type="password" placeholder="Minimum 8 characters" required>
        </div>
        <div class="field">
          <label for="r-pass2">Confirm Password *</label>
          <input id="r-pass2" type="password" placeholder="Repeat new password" required>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="reset-cancel-btn">Cancel</button>
        <button class="btn-primary-sm" id="reset-submit-btn">Reset Password</button>
      </div>
    </div>
  </div>


  <script type="module">
    import { api, tokens } from './assets/js/api.js';

    let currentRole = 'superadmin';

    // Decode JWT payload without verification (for role reading only)
    function parseJwt(token) {
      try {
        const base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
        return JSON.parse(atob(base64));
      } catch { return {}; }
    }

    // Friendly error messages per backend error code
    function friendlyError(ex) {
      const code = ex?.code || '';
      const msg  = ex?.message || '';
      if (code === 'LICENSE_REVOKED') return 'Your license is not active. Contact your Super Admin.';
      if (code === 'ACCOUNT_DISABLED') return 'This account has been disabled.';
      if (ex?.status === 401 || msg.toLowerCase().includes('invalid')) return 'Incorrect username or password.';
      if (ex?.status === 403) return msg || 'Access denied.';
      if (ex?.status === 0) return 'Cannot reach the server. Check your internet connection.';
      return msg || 'Sign-in failed. Please try again.';
    }

    // If already signed in, redirect
    if (tokens.access) { location.href = 'dashboard.html'; }

    window.switchRole = function(role) {
      currentRole = role;
      document.getElementById('tab-superadmin').classList.toggle('active', role === 'superadmin');
      document.getElementById('tab-admin').classList.toggle('active', role === 'admin');
      const badge = document.getElementById('role-indicator');
      const label = document.getElementById('role-label');
      if (role === 'superadmin') {
        badge.className = 'role-badge superadmin';
        label.textContent = 'Super Admin Access';
      } else {
        badge.className = 'role-badge admin';
        label.textContent = 'Admin Access';
      }
    };

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('error');
      const errMsg = document.getElementById('error-msg');
      const btn    = document.getElementById('submit-btn');
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        // Step 1 — authenticate
        const result = await api.login({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        });
        tokens.set(result);

        // Step 2 — read role from JWT payload (no extra round-trip needed)
        const claims  = parseJwt(result.access_token);
        const userRole = (claims.role || '').toUpperCase();

        // Step 3 — try to get full user profile (non-fatal if it fails)
        let me = { role: userRole };
        try {
          me = await api.me();
          me.role = me.role || userRole;
        } catch { /* use token claims if /me fails */ }

        localStorage.setItem('vagai_role', me.role);
        localStorage.setItem('vagai_user', JSON.stringify(me));

        // Step 4 — role gate
        if (currentRole === 'superadmin' && me.role !== 'SUPER_ADMIN') {
          tokens.clear();
          localStorage.removeItem('vagai_role');
          localStorage.removeItem('vagai_user');
          errMsg.textContent = 'This account is not a Super Admin. Please use the Admin tab instead.';
          errBox.style.display = 'flex';
          btn.disabled = false; btn.textContent = 'Sign In';
          return;
        }

        location.href = 'dashboard.html';
      } catch (ex) {
        tokens.clear();
        errMsg.textContent = friendlyError(ex);
        errBox.style.display = 'flex';
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    });

    // Reset Password modal events
    const resetModal = document.getElementById('reset-modal');
    const resetErr   = document.getElementById('reset-err');
    const resetErrMsg = document.getElementById('reset-err-msg');
    const resetBtn   = document.getElementById('reset-submit-btn');

    document.getElementById('open-reset-btn').addEventListener('click', () => {
      resetErr.style.display = 'none';
      document.getElementById('r-username').value = document.getElementById('username').value || '';
      document.getElementById('r-pass').value = '';
      document.getElementById('r-pass2').value = '';
      resetModal.hidden = false;
    });

    ['reset-close-btn', 'reset-cancel-btn'].forEach(id => {
      document.getElementById(id).addEventListener('click', () => {
        resetModal.hidden = true;
      });
    });

    resetBtn.addEventListener('click', async () => {
      const u = document.getElementById('r-username').value.trim();
      const p1 = document.getElementById('r-pass').value;
      const p2 = document.getElementById('r-pass2').value;

      if (!u) {
        resetErrMsg.textContent = 'Please enter your username or email.';
        resetErr.style.display = 'flex';
        return;
      }
      if (p1.length < 8) {
        resetErrMsg.textContent = 'Password must be at least 8 characters long.';
        resetErr.style.display = 'flex';
        return;
      }
      if (p1 !== p2) {
        resetErrMsg.textContent = 'Passwords do not match.';
        resetErr.style.display = 'flex';
        return;
      }

      resetErr.style.display = 'none';
      resetBtn.disabled = true;
      resetBtn.textContent = 'Resetting…';

      try {
        const res = await fetch(`${api.baseUrl || 'https://vagai-silambam-app.vercel.app'}/api/v1/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, new_password: p1 })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail?.message || data.detail || 'Reset failed');

        alert(data.message || 'Password reset successful! Please log in.');
        resetModal.hidden = true;
        document.getElementById('username').value = u;
        document.getElementById('password').value = p1;
      } catch (e) {
        resetErrMsg.textContent = e.message;
        resetErr.style.display = 'flex';
      } finally {
        resetBtn.disabled = false;
        resetBtn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
