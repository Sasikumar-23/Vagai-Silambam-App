<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events &amp; Tournaments · Vagai Silambam</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .event-type-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
    }
    .event-type-competition { background: #FEF3C7; color: #92400E; }
    .event-type-workshop { background: #EFF6FF; color: #1E40AF; }
    .event-type-belt_test { background: #F3E8FF; color: #6B21A8; }
    .event-type-seminar { background: #ECFDF5; color: #065F46; }
  </style>
</head>
<body>
  <script type="module">
    import { api } from './assets/js/api.js';
    import { applyTranslations, t } from './assets/js/i18n.js';
    import { mountShell, requireSession, toast } from './assets/js/auth.js';

    if (requireSession()) {
      const page = mountShell({ titleKey: 'nav_events' });
      render(page);
    }

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function statusBadge(status) {
      const cls = { UPCOMING: 'badge-trial', ONGOING: 'badge-active', COMPLETED: 'badge-inactive', CANCELLED: 'badge-suspended' }[status] || 'badge-trial';
      return `<span class="badge ${cls}">${esc(status || 'UPCOMING')}</span>`;
    }

    function typeBadge(type) {
      const t = (type || '').toLowerCase();
      return `<span class="event-type-pill event-type-${t}">★ ${esc(type)}</span>`;
    }

    async function render(page) {
      page.innerHTML = '<div class="card"><div class="skeleton" style="height:200px"></div></div>';

      try {
        const events = await api.listEvents();

        const addForm = `
          <div class="card" id="eventFormCard" style="display:none;animation:fadeIn 0.2s ease">
            <div class="card-head">
              <h3 data-i18n="add_event"><span>★</span> Add Academy Event / Championship</h3>
              <button type="button" class="btn btn-ghost btn-sm" id="closeEventForm">✕</button>
            </div>
            <form id="addEventForm" style="display:grid;gap:var(--space-4);grid-template-columns:1fr 1fr">
              <div class="field" style="grid-column:1/-1">
                <label data-i18n="event_title_en">Event Title (English)</label>
                <input id="evtTitle" type="text" required placeholder="e.g. Tamil Nadu State Silambam Championship 2026">
              </div>
              <div class="field">
                <label data-i18n="event_type">Category Type</label>
                <select id="evtType">
                  <option value="COMPETITION">Competition / Tournament</option>
                  <option value="WORKSHOP">Technical Workshop</option>
                  <option value="BELT_TEST">Belt Grading &amp; Exam</option>
                  <option value="SEMINAR">Masters Seminar</option>
                </select>
              </div>
              <div class="field">
                <label data-i18n="event_date">Event Date</label>
                <input id="evtDate" type="date" required>
              </div>
              <div class="field">
                <label data-i18n="venue">Venue &amp; City</label>
                <input id="evtVenue" type="text" placeholder="e.g. Indoor Stadium, Chennai">
              </div>
              <div class="field">
                <label data-i18n="registration_fee">Registration Fee (₹)</label>
                <input id="evtFee" type="number" value="0" min="0" step="50">
              </div>
              <div style="grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;margin-top:6px">
                <button type="button" class="btn btn-ghost" id="cancelEventBtn">Cancel</button>
                <button type="submit" class="btn btn-primary" data-i18n="add_event">Save Event</button>
              </div>
            </form>
          </div>`;

        const table = events.length ? `
          <div class="card" style="padding:0;overflow:hidden">
            <div class="card-head" style="padding:22px 24px 14px;margin-bottom:0">
              <h3 data-i18n="events_list"><span>🏆</span> Academy Events Schedule</h3>
              <button id="toggleEventFormBtn" class="btn btn-primary btn-sm">+ Create Event</button>
            </div>
            <div style="overflow-x:auto">
              <table>
                <thead><tr>
                  <th>Event Title</th><th>Category</th><th>Event Date</th><th>Venue</th><th>Entry Fee</th><th>Status</th>
                </tr></thead>
                <tbody>
                  ${events.map(ev => `
                    <tr>
                      <td style="font-weight:700">${esc(ev.title_en)}</td>
                      <td>${typeBadge(ev.event_type)}</td>
                      <td><code>${esc(ev.event_date)}</code></td>
                      <td>${esc(ev.venue || '—')}</td>
                      <td style="font-weight:700">₹${ev.registration_fee.toLocaleString()}</td>
                      <td>${statusBadge(ev.status)}</td>
                    </tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>` : `
          <div class="card">
            <div class="empty">
              <div class="mark">★</div>
              <h3>No events scheduled yet</h3>
              <p>Organize belt gradings, championships, and workshops for your students.</p>
              <button id="toggleEventFormEmpty" class="btn btn-primary btn-sm" style="margin-top:12px">+ Schedule First Event</button>
            </div>
          </div>`;

        page.innerHTML = addForm + table;
        applyTranslations(page);

        // Toggle form
        const formCard = document.getElementById('eventFormCard');
        const showForm = () => { formCard.style.display = 'block'; };
        const hideForm = () => { formCard.style.display = 'none'; };

        const b1 = document.getElementById('toggleEventFormBtn');
        const b2 = document.getElementById('toggleEventFormEmpty');
        const c1 = document.getElementById('closeEventForm');
        const c2 = document.getElementById('cancelEventBtn');

        if (b1) b1.addEventListener('click', showForm);
        if (b2) b2.addEventListener('click', showForm);
        if (c1) c1.addEventListener('click', hideForm);
        if (c2) c2.addEventListener('click', hideForm);

        document.getElementById('addEventForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const btn = e.target.querySelector('button[type=submit]');
          btn.disabled = true;
          try {
            await api.createEvent({
              title_en: document.getElementById('evtTitle').value.trim(),
              event_type: document.getElementById('evtType').value,
              event_date: document.getElementById('evtDate').value,
              venue: document.getElementById('evtVenue').value.trim() || null,
              registration_fee: parseFloat(document.getElementById('evtFee').value) || 0,
            });
            toast('Event published successfully!', 'success');
            render(page);
          } catch (err) { toast(err.message, 'error'); } finally { btn.disabled = false; }
        });

      } catch (err) {
        page.innerHTML = `<div class="alert alert-error">${esc(err.message)}</div>`;
      }
    }
  </script>
</body>
</html>
