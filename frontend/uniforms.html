<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uniforms &amp; Kits · Vagai Silambam</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <script type="module">
    import { api } from './assets/js/api.js';
    import { applyTranslations } from './assets/js/i18n.js';
    import { mountShell, requireSession, toast } from './assets/js/auth.js';

    if (requireSession()) {
      const page = mountShell({ titleKey: 'nav_uniforms' });
      render(page);
    }

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    async function render(page) {
      page.innerHTML = '<div class="card"><div class="skeleton" style="height:160px"></div></div>';

      try {
        const [uniforms, students] = await Promise.all([
          api.listUniforms({ limit: 50 }),
          api.listStudents({ limit: 200, status: 'ACTIVE' }),
        ]);

        const studentOpts = students.items.map(s =>
          `<option value="${esc(s.id)}">${esc(s.name_en)} (${esc(s.student_code)})</option>`
        ).join('');

        const studentMap = {};
        students.items.forEach(s => { studentMap[s.id] = s.name_en; });

        const addForm = `
          <div class="card" id="uniFormCard" style="display:none;animation:fadeIn 0.2s ease">
            <div class="card-head">
              <h3><span>👕</span> Place Uniform / Kit Order</h3>
              <button type="button" class="btn btn-ghost btn-sm" id="closeUniForm">✕</button>
            </div>
            <form id="orderUniForm" style="display:grid;gap:var(--space-4);grid-template-columns:1fr 1fr">
              <div class="field" style="grid-column:1/-1">
                <label>Student</label>
                <select id="uniStudent" required><option value="">— Select Student —</option>${studentOpts}</select>
              </div>
              <div class="field">
                <label>Kit Item / Uniform</label>
                <select id="uniType">
                  <option value="STANDARD_SUIT">Standard Uniform Suit</option>
                  <option value="WEAPONS_KIT">Silambam Staff / Weapons Kit</option>
                  <option value="BELT">Color Belt</option>
                  <option value="PRACTICE_TEE">Academy Practice T-Shirt</option>
                </select>
              </div>
              <div class="field">
                <label>Size / Dimensions</label>
                <input id="uniSize" type="text" required placeholder="e.g. 34 / M / XL / 5ft">
              </div>
              <div class="field">
                <label>Price (₹)</label>
                <input id="uniPrice" type="number" min="0" step="50" value="0">
              </div>
              <div style="grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;margin-top:6px">
                <button type="button" class="btn btn-ghost" id="cancelUniBtn">Cancel</button>
                <button type="submit" class="btn btn-primary">Place Order</button>
              </div>
            </form>
          </div>`;

        const rows = uniforms.map(u => {
          const statusCls = { DELIVERED: 'badge-active', REQUESTED: 'badge-trial' }[u.status] || 'badge-trial';
          const studentName = studentMap[u.student_id] || u.student_id;
          const paidBadge = u.is_paid 
            ? `<span style="color:#059669;font-weight:700">✓ Paid</span>` 
            : `<span style="color:#BE123C;font-weight:700">Pending</span>`;

          return `<tr>
            <td style="font-weight:700">${esc(u.uniform_type)}</td>
            <td>${esc(studentName)}</td>
            <td><code style="font-weight:700;padding:2px 8px;background:var(--surface-subtle);border-radius:4px">${esc(u.size)}</code></td>
            <td style="font-weight:700">₹${u.price.toLocaleString()}</td>
            <td>${paidBadge}</td>
            <td><span class="badge ${statusCls}">${esc(u.status)}</span></td>
            <td>${esc(u.order_date || '—')}</td>
            <td>${esc(u.delivery_date || '—')}</td>
          </tr>`;
        }).join('');

        const table = uniforms.length ? `
          <div class="card" style="padding:0;overflow:hidden">
            <div class="card-head" style="padding:22px 24px 14px;margin-bottom:0">
              <h3><span>📦</span> Uniform &amp; Weapon Orders</h3>
              <button id="toggleUniFormBtn" class="btn btn-primary btn-sm">+ Place Order</button>
            </div>
            <div style="overflow-x:auto">
              <table>
                <thead><tr>
                  <th>Kit Type</th><th>Student</th><th>Size</th><th>Price</th>
                  <th>Payment</th><th>Status</th><th>Ordered</th><th>Delivered</th>
                </tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>` : `
          <div class="card">
            <div class="empty">
              <div class="mark">👕</div>
              <h3>No uniform orders recorded</h3>
              <p>Place uniform, belt, or silambam stick orders for academy students.</p>
              <button id="toggleUniFormEmpty" class="btn btn-primary btn-sm" style="margin-top:12px">+ Place First Order</button>
            </div>
          </div>`;

        page.innerHTML = addForm + table;
        applyTranslations(page);

        // Toggle logic
        const formCard = document.getElementById('uniFormCard');
        const showForm = () => { formCard.style.display = 'block'; };
        const hideForm = () => { formCard.style.display = 'none'; };

        const b1 = document.getElementById('toggleUniFormBtn');
        const b2 = document.getElementById('toggleUniFormEmpty');
        const c1 = document.getElementById('closeUniForm');
        const c2 = document.getElementById('cancelUniBtn');

        if (b1) b1.addEventListener('click', showForm);
        if (b2) b2.addEventListener('click', showForm);
        if (c1) c1.addEventListener('click', hideForm);
        if (c2) c2.addEventListener('click', hideForm);

        document.getElementById('orderUniForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const btn = e.target.querySelector('button[type=submit]');
          btn.disabled = true;
          try {
            await api.createUniform({
              student_id: document.getElementById('uniStudent').value,
              uniform_type: document.getElementById('uniType').value,
              size: document.getElementById('uniSize').value.trim(),
              price: parseFloat(document.getElementById('uniPrice').value) || 0,
            });
            toast('Uniform order placed successfully!', 'success');
            render(page);
          } catch (err) { toast(err.message, 'error'); } finally { btn.disabled = false; }
        });

      } catch (err) {
        page.innerHTML = `<div class="alert alert-error">${esc(err.message)}</div>`;
      }
    }
  </script>
</body>
</html>
