<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users &amp; Licenses · Vagai Silambam</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    /* ───────────── Aceternity UI & Magic UI Visual Styling ───────────── */

    .page-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }
    .page-title-group h1 {
      font-size: 23px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-title-group p {
      margin: 4px 0 0;
      color: var(--text-muted);
      font-size: 13.5px;
    }

    /* Aceternity Spotlight / Border Beam Inspired Metric Cards */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04), 0 4px 12px rgba(15, 23, 42, 0.02);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* Subtle Magic UI radial spotlight on card hover */
    .metric-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), var(--metric-spotlight, rgba(37,99,235,0.06)), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .metric-card:hover {
      border-color: var(--metric-border, var(--border-strong));
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .metric-card:hover::before {
      opacity: 1;
    }
    .metric-info .metric-label {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .metric-info .metric-value {
      font-size: 30px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.6px;
      line-height: 1.1;
    }
    .metric-icon-box {
      width: 46px;
      height: 46px;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      color: var(--metric-color, var(--primary));
      background: var(--metric-bg, var(--primary-muted));
      border: 1px solid var(--metric-border, var(--primary-border));
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    /* Academy User Directory Card */
    .directory-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.03);
      overflow: hidden;
      margin-bottom: 24px;
    }
    .directory-header {
      padding: 20px 26px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .directory-header h3 {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--text);
    }
    .directory-count-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    /* Magic UI Toolbar: Search & Filters */
    .directory-toolbar {
      padding: 14px 26px;
      background: var(--surface-subtle);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 220px;
      max-width: 360px;
    }
    .search-wrapper input {
      width: 100%;
      padding: 9px 14px 9px 36px;
      font-family: inherit;
      font-size: 13.5px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      outline: none;
      transition: all 0.18s ease;
    }
    .search-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .search-wrapper svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .filter-select {
      padding: 9px 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      color: var(--text);
      outline: none;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .filter-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    /* Professional Table */
    .table-responsive {
      overflow-x: auto;
    }
    .user-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }
    .user-table th {
      padding: 13px 22px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
    }
    .user-table td {
      padding: 15px 22px;
      vertical-align: middle;
      border-bottom: 1px solid var(--border-light);
      font-size: 13.5px;
    }
    .user-table tbody tr {
      transition: background 0.15s ease;
    }
    .user-table tbody tr:hover {
      background: #F8FAFC;
    }
    .user-table tbody tr:last-child td {
      border-bottom: none;
    }

    .user-profile-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-monogram {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--navy-900), var(--navy-800));
      color: #FFFFFF;
      font-weight: 700;
      font-size: 13px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    .user-meta-name {
      font-weight: 700;
      color: var(--text);
      display: block;
    }
    .user-meta-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .role-tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 700;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .role-tag.admin {
      background: #EFF6FF;
      border-color: #BFDBFE;
      color: #1E40AF;
    }

    .status-dot-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      border-radius: var(--radius-pill);
      font-size: 11.5px;
      font-weight: 700;
    }
    .status-dot-badge.active {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }
    .status-dot-badge.active::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
    }
    .status-dot-badge.revoked {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
    }
    .status-dot-badge.revoked::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--danger);
    }

    /* Three-Dot Action Menu */
    .action-menu-wrap {
      position: relative;
      display: inline-block;
    }
    .action-menu-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      background: transparent;
      display: grid;
      place-items: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .action-menu-btn:hover {
      background: var(--surface-subtle);
      border-color: var(--border);
      color: var(--text);
    }
    .action-dropdown {
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 4px;
      width: 175px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
      z-index: 50;
      padding: 4px;
      display: none;
    }
    .action-dropdown.show {
      display: block;
      animation: menuPop 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes menuPop {
      from { opacity: 0; transform: translateY(-4px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .action-dropdown button {
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      border: 0;
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      transition: all 0.12s ease;
    }
    .action-dropdown button:hover {
      background: var(--surface-subtle);
      color: var(--text);
    }
    .action-dropdown button.danger-item:hover {
      background: var(--danger-bg);
      color: var(--danger);
    }

    /* Add User Dialog (Magic UI Blur Dialog) */
    .dialog-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 19, 36, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 999;
      display: grid;
      place-items: center;
      padding: 20px;
      animation: fadeIn 0.18s ease;
    }
    .dialog-backdrop[hidden] {
      display: none;
    }
    .dialog-card {
      width: 100%;
      max-width: 540px;
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: 0 25px 60px rgba(10, 19, 36, 0.25);
      overflow: hidden;
      animation: dialogPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes dialogPop {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .dialog-head {
      padding: 20px 26px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-subtle);
    }
    .dialog-head h3 {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--navy-900);
    }
    .dialog-close {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .dialog-close:hover {
      background: var(--surface-subtle);
      color: var(--text);
    }
    .dialog-body {
      padding: 26px;
    }
    .dialog-foot {
      padding: 16px 26px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: var(--surface-subtle);
    }

    /* Aceternity Border Beam Callout Notification */
    .key-callout {
      background: linear-gradient(135deg, #ECFDF5 0%, #F0FDF4 100%);
      border: 1.5px solid #A7F3D0;
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 26px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.12);
      animation: fadeIn 0.2s ease;
    }
    .key-callout-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .key-callout-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--success-text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .key-callout-desc {
      font-size: 13px;
      color: var(--success-text);
      margin: 0;
    }
    .key-code-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #FFFFFF;
      padding: 10px 14px;
      border: 1px dashed #34D399;
      border-radius: var(--radius-md);
      flex-wrap: wrap;
    }
    .key-code-row code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 15.5px;
      font-weight: 700;
      color: var(--navy-900);
      letter-spacing: 0.6px;
      user-select: all;
      flex: 1;
    }
  </style>
</head>
<body>
  <!-- Add User Modal Dialog -->
  <div class="dialog-backdrop" id="userModal" hidden>
    <div class="dialog-card">
      <div class="dialog-head">
        <h3>Create Academy User &amp; License</h3>
        <button type="button" class="dialog-close" id="closeModalBtn" aria-label="Close">✕</button>
      </div>
      <form id="addUserForm">
        <div class="dialog-body">
          <div style="display:grid;gap:16px;grid-template-columns:1fr 1fr">
            <div class="field">
              <label>Username</label>
              <input id="uName" type="text" required minlength="3" maxlength="80"
                     pattern="[A-Za-z0-9._-]+" placeholder="coach_ravi">
              <div class="hint">Alphanumeric, dots, or underscores</div>
            </div>
            <div class="field">
              <label>Password (min 8 chars)</label>
              <input id="uPass" type="password" required minlength="8" maxlength="200" autocomplete="new-password" placeholder="••••••••">
            </div>
            <div class="field">
              <label>Full Name (English)</label>
              <input id="uFullEn" type="text" required minlength="2" maxlength="200" placeholder="Ravi Chandran">
            </div>
            <div class="field">
              <label>Full Name (Tamil, optional)</label>
              <input id="uFullTa" type="text" maxlength="200" placeholder="ரவி சந்திரன்">
            </div>
          </div>
        </div>
        <div class="dialog-foot">
          <button type="button" class="btn btn-ghost" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveUserBtn">Issue License &amp; Create</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { api } from './assets/js/api.js';
    import { applyTranslations, t } from './assets/js/i18n.js';
    import { mountShell, requireSession, toast } from './assets/js/auth.js';

    if (requireSession()) {
      const page = mountShell({ titleKey: 'nav_users' });
      render(page);
    }

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function getMonogram(name) {
      if (!name) return 'U';
      const parts = name.trim().split(/\s+/);
      if (parts.length >= 2) {
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }
      return name.slice(0, 2).toUpperCase();
    }

    function statusBadge(status) {
      const s = (status || 'NONE').toUpperCase();
      if (s === 'ACTIVE') {
        return `<span class="status-dot-badge active">Active</span>`;
      }
      return `<span class="status-dot-badge revoked">Revoked</span>`;
    }

    function roleTag(role) {
      const r = (role || 'COACH').toUpperCase();
      const isAdmin = r === 'ADMIN';
      return `<span class="role-tag ${isAdmin ? 'admin' : ''}">${esc(r)}</span>`;
    }

    function keyBanner(result) {
      return `
        <div class="key-callout" id="keyBanner">
          <div class="key-callout-head">
            <div class="key-callout-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 2l-2 2m-1.5 1.5L16 7l-1.5-1.5M19 4l-4 4-2-2-4 4 2 2-3 3H4v-4l3-3-2-2 4-4 2 2 4-4z"></path><circle cx="7.5" cy="16.5" r="1.5"></circle></svg>
              <span>License Key for <strong>${esc(result.user.username)}</strong></span>
            </div>
            <button id="dismissKey" class="btn btn-ghost btn-sm" style="padding:4px 10px;font-size:11.5px">Dismiss</button>
          </div>
          <p class="key-callout-desc">Share this authorization key with the coach or admin. <strong>For security, it is displayed only once.</strong></p>
          <div class="key-code-row">
            <code id="licenseKeyValue">${esc(result.license_key)}</code>
            <button id="copyKey" class="btn btn-primary btn-sm">Copy Key</button>
          </div>
        </div>`;
    }

    let allUsers = [];

    async function render(page, banner = '') {
      page.innerHTML = `
        <div class="metric-grid">
          <div class="metric-card"><div class="skeleton" style="width:100%;height:44px"></div></div>
          <div class="metric-card"><div class="skeleton" style="width:100%;height:44px"></div></div>
          <div class="metric-card"><div class="skeleton" style="width:100%;height:44px"></div></div>
        </div>
        <div class="directory-card"><div class="skeleton" style="height:260px"></div></div>`;

      try {
        allUsers = await api.listUsers();
        renderDashboard(page, banner);
      } catch (err) {
        page.innerHTML = `
          <div class="directory-card">
            <div class="empty">
              <div class="mark">!</div>
              <h3>Could not load users</h3>
              <p>${esc(err.message)}</p>
              <button class="btn btn-primary btn-sm" onclick="location.reload()" style="margin-top:12px">Retry</button>
            </div>
          </div>`;
      }
    }

    function renderDashboard(page, banner = '') {
      const total = allUsers.length;
      const active = allUsers.filter(u => u.license_status === 'ACTIVE').length;
      const revoked = allUsers.filter(u => u.license_status === 'REVOKED').length;

      const headerRow = `
        <div class="page-header-row">
          <div class="page-title-group">
            <h1>Users &amp; Licenses</h1>
            <p>Manage academy administrative access, coach credentials, and license activations</p>
          </div>
          <button id="openModalBtn" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Add New User
          </button>
        </div>`;

      const metricCards = `
        <div class="metric-grid">
          <div class="metric-card" style="--metric-color:#2563EB;--metric-bg:#EFF6FF;--metric-border:#BFDBFE;--metric-spotlight:rgba(37,99,235,0.08)">
            <div class="metric-info">
              <div class="metric-label">Total Users</div>
              <div class="metric-value">${total}</div>
            </div>
            <div class="metric-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            </div>
          </div>

          <div class="metric-card" style="--metric-color:#10B981;--metric-bg:#ECFDF5;--metric-border:#A7F3D0;--metric-spotlight:rgba(16,185,129,0.08)">
            <div class="metric-info">
              <div class="metric-label">Active Licenses</div>
              <div class="metric-value">${active}</div>
            </div>
            <div class="metric-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>
          </div>

          <div class="metric-card" style="--metric-color:#EF4444;--metric-bg:#FEF2F2;--metric-border:#FECACA;--metric-spotlight:rgba(239,68,68,0.08)">
            <div class="metric-info">
              <div class="metric-label">Revoked / Suspended</div>
              <div class="metric-value">${revoked}</div>
            </div>
            <div class="metric-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
            </div>
          </div>
        </div>`;

      const directoryCard = `
        <div class="directory-card">
          <div class="directory-header">
            <h3>Academy User Directory</h3>
            <span class="directory-count-badge" id="userCountBadge">${total} Accounts</span>
          </div>

          <div class="directory-toolbar">
            <div class="search-wrapper">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input type="text" id="searchInput" placeholder="Search by username, name…">
            </div>

            <select id="roleFilter" class="filter-select">
              <option value="">All Roles</option>
              <option value="ADMIN">Admin</option>
              <option value="COACH">Coach</option>
            </select>

            <select id="statusFilter" class="filter-select">
              <option value="">All Statuses</option>
              <option value="ACTIVE">Active</option>
              <option value="REVOKED">Revoked</option>
            </select>
          </div>

          <div class="table-responsive">
            <table class="user-table">
              <thead>
                <tr>
                  <th>User Profile</th>
                  <th>Full Name</th>
                  <th>Role</th>
                  <th>License Status</th>
                  <th style="text-align:right">Actions</th>
                </tr>
              </thead>
              <tbody id="userTableBody">
                ${buildRows(allUsers)}
              </tbody>
            </table>
          </div>
        </div>`;

      page.innerHTML = banner + headerRow + metricCards + directoryCard;
      applyTranslations(page);
      bindEvents(page);

      // Attach Aceternity cursor spotlight tracking to metric cards
      page.querySelectorAll('.metric-card').forEach(card => {
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
          card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
        });
      });
    }

    function buildRows(users) {
      if (!users.length) {
        return `
          <tr>
            <td colspan="5" style="text-align:center;padding:48px 20px">
              <div class="empty" style="padding:0">
                <div class="mark">∅</div>
                <h3>No matching users found</h3>
                <p>Try adjusting your search query or filter options.</p>
              </div>
            </td>
          </tr>`;
      }

      return users.map(u => {
        const initials = getMonogram(u.full_name_en || u.username);
        const isActive = u.license_status === 'ACTIVE';
        const displayTa = u.full_name_ta ? `<span style="display:block;font-size:12px;color:var(--text-muted)">${esc(u.full_name_ta)}</span>` : '';

        return `<tr>
          <td>
            <div class="user-profile-cell">
              <div class="user-monogram">${initials}</div>
              <div>
                <span class="user-meta-name">${esc(u.username)}</span>
                <span class="user-meta-sub">ID #${esc(String(u.id).slice(0, 8))}</span>
              </div>
            </div>
          </td>
          <td>
            <div style="font-weight:700;color:var(--text)">${esc(u.full_name_en || '—')}</div>
            ${displayTa}
          </td>
          <td>${roleTag(u.role)}</td>
          <td>${statusBadge(u.license_status)}</td>
          <td style="text-align:right">
            <div class="action-menu-wrap">
              <button class="action-menu-btn menu-trigger" data-id="${esc(u.id)}" aria-label="Actions">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
              </button>
              <div class="action-dropdown" id="dropdown-${esc(u.id)}">
                <button class="copy-user-btn" data-username="${esc(u.username)}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                  Copy Username
                </button>
                ${isActive ? `
                  <button class="revoke-btn danger-item" data-id="${esc(u.id)}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                    Revoke License
                  </button>
                ` : `
                  <button class="reissue-btn" data-id="${esc(u.id)}" style="color:var(--primary)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    Reissue License
                  </button>
                `}
              </div>
            </div>
          </td>
        </tr>`;
      }).join('');
    }

    function bindEvents(page) {
      // Key Banner Handlers
      const dismiss = document.getElementById('dismissKey');
      if (dismiss) {
        dismiss.addEventListener('click', () => {
          const b = document.getElementById('keyBanner');
          if (b) b.remove();
        });
      }

      const copy = document.getElementById('copyKey');
      if (copy) {
        copy.addEventListener('click', async () => {
          const val = document.getElementById('licenseKeyValue').textContent;
          await navigator.clipboard.writeText(val);
          toast('License key copied to clipboard!', 'success');
        });
      }

      // Modal Dialog
      const modal = document.getElementById('userModal');
      const openModalBtn = document.getElementById('openModalBtn');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const cancelModalBtn = document.getElementById('cancelModalBtn');
      const form = document.getElementById('addUserForm');

      const openDialog = () => {
        form.reset();
        modal.hidden = false;
        document.getElementById('uName').focus();
      };
      const closeDialog = () => { modal.hidden = true; };

      if (openModalBtn) openModalBtn.addEventListener('click', openDialog);
      if (closeModalBtn) closeModalBtn.addEventListener('click', closeDialog);
      if (cancelModalBtn) cancelModalBtn.addEventListener('click', closeDialog);
      modal.addEventListener('click', (e) => { if (e.target === modal) closeDialog(); });

      // Form Submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById('saveUserBtn');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Creating user…';

        try {
          const result = await api.createUser({
            username: document.getElementById('uName').value.trim(),
            full_name_en: document.getElementById('uFullEn').value.trim(),
            full_name_ta: document.getElementById('uFullTa').value.trim() || null,
            password: document.getElementById('uPass').value,
          });
          closeDialog();
          toast('User created and license key generated', 'success');
          await render(page, keyBanner(result));
        } catch (err) {
          toast(err.message, 'error');
          saveBtn.disabled = false;
          saveBtn.textContent = 'Issue License & Create';
        }
      });

      // Filter & Search Logic
      const searchInput = document.getElementById('searchInput');
      const roleFilter = document.getElementById('roleFilter');
      const statusFilter = document.getElementById('statusFilter');
      const tableBody = document.getElementById('userTableBody');
      const countBadge = document.getElementById('userCountBadge');

      function applyFilter() {
        const q = (searchInput?.value || '').toLowerCase().trim();
        const role = roleFilter?.value || '';
        const status = statusFilter?.value || '';

        const filtered = allUsers.filter(u => {
          const matchQuery = !q ||
            (u.username && u.username.toLowerCase().includes(q)) ||
            (u.full_name_en && u.full_name_en.toLowerCase().includes(q)) ||
            (u.full_name_ta && u.full_name_ta.toLowerCase().includes(q));

          const matchRole = !role || (u.role || 'COACH').toUpperCase() === role;
          const matchStatus = !status || (u.license_status || 'NONE').toUpperCase() === status;

          return matchQuery && matchRole && matchStatus;
        });

        tableBody.innerHTML = buildRows(filtered);
        if (countBadge) countBadge.textContent = `${filtered.length} Accounts`;
        bindRowActions(page);
      }

      if (searchInput) searchInput.addEventListener('input', applyFilter);
      if (roleFilter) roleFilter.addEventListener('change', applyFilter);
      if (statusFilter) statusFilter.addEventListener('change', applyFilter);

      bindRowActions(page);
    }

    function bindRowActions(page) {
      // Close dropdowns on outside click
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.action-menu-wrap')) {
          document.querySelectorAll('.action-dropdown.show').forEach(d => d.classList.remove('show'));
        }
      });

      // Toggle dropdown menu
      page.querySelectorAll('.menu-trigger').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          const dropdown = document.getElementById(`dropdown-${id}`);
          const isOpen = dropdown.classList.contains('show');
          document.querySelectorAll('.action-dropdown.show').forEach(d => d.classList.remove('show'));
          if (!isOpen) dropdown.classList.add('show');
        };
      });

      // Copy username
      page.querySelectorAll('.copy-user-btn').forEach(btn => {
        btn.onclick = async () => {
          await navigator.clipboard.writeText(btn.dataset.username);
          toast(`Username "${btn.dataset.username}" copied`);
          document.querySelectorAll('.action-dropdown.show').forEach(d => d.classList.remove('show'));
        };
      });

      // Revoke license
      page.querySelectorAll('.revoke-btn').forEach(btn => {
        btn.onclick = async () => {
          document.querySelectorAll('.action-dropdown.show').forEach(d => d.classList.remove('show'));
          if (!confirm('Revoke this coach license? The user will immediately be barred from signing in.')) return;
          try {
            await api.revokeLicense(btn.dataset.id);
            toast('License revoked successfully', 'info');
            await render(page);
          } catch (err) { toast(err.message, 'error'); }
        };
      });

      // Reissue license
      page.querySelectorAll('.reissue-btn').forEach(btn => {
        btn.onclick = async () => {
          document.querySelectorAll('.action-dropdown.show').forEach(d => d.classList.remove('show'));
          try {
            const result = await api.reissueLicense(btn.dataset.id);
            toast('New license key generated', 'success');
            await render(page, keyBanner(result));
          } catch (err) { toast(err.message, 'error'); }
        };
      });
    }
  </script>
</body>
</html>
