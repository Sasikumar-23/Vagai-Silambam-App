<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Vagai Silambam</title>
  <link rel="stylesheet" href="assets/css/style.css">  <style>
    /* ── Metric Grid ── */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      transition: all 0.22s cubic-bezier(0.16,1,0.3,1);
      box-shadow: var(--shadow-xs);
      position: relative;
      overflow: hidden;
    }
    .metric-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: var(--metric-color, var(--primary));
      border-radius: 0 0 2px 2px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .metric-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--border-strong); }
    .metric-card:hover::after { opacity: 1; }

    .metric-info .lbl {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .metric-info .val {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .metric-info .sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .metric-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    /* Colour tokens */
    .mc-blue  { --metric-color:#E8873A; } .mc-blue  .metric-icon { background:rgba(232, 135, 58, 0.16); color:#E8873A; }
    .mc-green { --metric-color:#34D399; } .mc-green .metric-icon { background:rgba(52, 211, 153, 0.16); color:#6EE7B7; }
    .mc-amber { --metric-color:#C9A25A; } .mc-amber .metric-icon { background:rgba(201, 162, 90, 0.16); color:#C9A25A; }
    .mc-violet{ --metric-color:#1D3B47; } .mc-violet .metric-icon { background:rgba(29, 59, 71, 0.4); color:#E8873A; }
    .mc-rose  { --metric-color:#EF4444; } .mc-rose  .metric-icon { background:rgba(248, 113, 113, 0.15); color:#FCA5A5; }
    .mc-teal  { --metric-color:#C9A25A; } .mc-teal  .metric-icon { background:rgba(29, 59, 71, 0.4); color:#C9A25A; }

    /* ── Section header ── */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
    }
    .section-head h3 {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.2px;
    }

    /* ── Tables ── */
    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow-xs);
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: var(--surface-subtle);
      padding: 11px 16px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody td {
      padding: 12px 16px;
      font-size: 13.5px;
      color: var(--text);
      border-bottom: 1px solid var(--border-light);
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255, 255, 255, 0.03); }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .badge-green  { background:rgba(52, 211, 153, 0.16); color:#6EE7B7; border:1px solid rgba(52, 211, 153, 0.3); }
    .badge-red    { background:rgba(248, 113, 113, 0.15); color:#FCA5A5; border:1px solid rgba(248, 113, 113, 0.3); }
    .badge-amber  { background:rgba(201, 162, 90, 0.16); color:#C9A25A; border:1px solid rgba(201, 162, 90, 0.3); }
    .badge-blue   { background:rgba(232, 135, 58, 0.16); color:#E8873A; border:1px solid rgba(232, 135, 58, 0.3); }
    .badge-gray   { background:rgba(237, 230, 218, 0.08); color:#EDE6DA; }
    .badge-violet { background:rgba(29, 59, 71, 0.45); color:#C9A25A; border:1px solid rgba(29, 59, 71, 0.6); }

    /* ── Two column layout ── */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media(max-width:900px) { .grid-2 { grid-template-columns:1fr; } }

    .page-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }
    .page-title h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.4px;
    }
    .page-title p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Revenue highlight */
    .revenue-big {
      font-size: 36px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -1px;
    }
    .revenue-label { font-size: 13px; color: var(--text-muted); }

    .expiry-row { display: flex; align-items: center; gap: 10px; }
    .expiry-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  </style>
</head>
<body>
<script type="module">
  import { requireSession, mountShell, toast, getCurrentUser, isSuperAdmin } from './assets/js/auth.js';
  import { api } from './assets/js/api.js';

  if (!requireSession()) throw new Error('redirect');

  mountShell({ title: 'Dashboard' });

  const pg = document.getElementById('page');
  const user = getCurrentUser();
  const sa = isSuperAdmin();

  pg.innerHTML = `
    <div class="page-header-row">
      <div class="page-title">
        <h1>👋 Welcome back, ${user.full_name_en || user.username || 'Admin'}</h1>
        <p>${sa ? 'Super Admin — Platform overview' : 'Admin — Academy management overview'}</p>
      </div>
      <button class="btn btn-primary" onclick="location.reload()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.91-5.54"/></svg>
        Refresh
      </button>
    </div>

    <!-- Metrics -->
    <div class="metric-grid" id="metrics">
      ${[0,1,2,3,4,5].map(i=>`<div class="metric-card"><div class="metric-info"><div class="lbl"><span class="skeleton" style="width:80px;height:10px;display:block"></span></div><div class="val"><span class="skeleton" style="width:60px;height:26px;display:block;margin-top:6px"></span></div></div></div>`).join('')}
    </div>

    <div class="grid-2">
      <!-- Recent Organizations -->
      <div>
        <div class="section-head">
          <h3>Recent Academies</h3>
          <a href="customers.html" class="btn btn-ghost btn-sm">View all →</a>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Academy</th><th>Status</th><th>Plan</th></tr></thead>
            <tbody id="org-rows"><tr><td colspan="3" style="text-align:center;padding:24px;color:var(--text-muted)">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- Expiring Licenses -->
      <div>
        <div class="section-head">
          <h3>⚠️ Expiring Soon</h3>
          <a href="licenses.html" class="btn btn-ghost btn-sm">Manage →</a>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Academy</th><th>Expires</th><th>Status</th></tr></thead>
            <tbody id="expiry-rows"><tr><td colspan="3" style="text-align:center;padding:24px;color:var(--text-muted)">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Monthly Revenue -->
    <div class="section-head">
      <h3>Payments Overview</h3>
      <a href="subscription.html" class="btn btn-ghost btn-sm">Manage →</a>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Academy</th><th>Amount</th><th>Gateway</th><th>Status</th><th>Date</th></tr></thead>
        <tbody id="payment-rows"><tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-muted)">Loading…</td></tr></tbody>
      </table>
    </div>
  `;

  // Load data
  try {
    const [overview, orgs] = await Promise.all([
      api.adminOverview().catch(()=>null),
      api.listOrganizations().catch(()=>({organizations:[]}))
    ]);

    // Map backend field names → display values
    // adminOverview returns: { total_academies, active_academies, suspended_academies, total_students, completed_payments }
    const ov           = overview || {};
    const orgList      = orgs?.organizations || [];
    const totalCustomers  = ov.total_academies  ?? orgList.length;
    const activeSubs      = ov.active_academies ?? orgList.filter(o=>o.subscription_status==='ACTIVE').length;
    const pendingPayments = ov.suspended_academies ?? orgList.filter(o=>o.status==='SUSPENDED').length;
    const activeLicenses  = orgList.filter(o=>o.subscription_status==='ACTIVE').length;
    const expiringLics    = 0; // computed below
    const monthlyRevenue  = ov.completed_payments ?? 0;

    document.getElementById('metrics').innerHTML = `
      <div class="metric-card mc-blue">
        <div class="metric-info">
          <div class="lbl">Total Customers</div>
          <div class="val">${totalCustomers}</div>
          <div class="sub">Registered academies</div>
        </div>
        <div class="metric-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      </div>
      <div class="metric-card mc-green">
        <div class="metric-info">
          <div class="lbl">Active Subscriptions</div>
          <div class="val">${activeSubs}</div>
          <div class="sub">Paying customers</div>
        </div>
        <div class="metric-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></div>
      </div>
      <div class="metric-card mc-amber">
        <div class="metric-info">
          <div class="lbl">Pending Payments</div>
          <div class="val">${pendingPayments}</div>
          <div class="sub">Awaiting verification</div>
        </div>
        <div class="metric-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
      </div>
      <div class="metric-card mc-violet">
        <div class="metric-info">
          <div class="lbl">Active Licenses</div>
          <div class="val">${activeLicenses}</div>
          <div class="sub">App access granted</div>
        </div>
        <div class="metric-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      </div>
      <div class="metric-card mc-rose">
        <div class="metric-info">
          <div class="lbl">Expiring Soon</div>
          <div class="val">${expiringLics}</div>
          <div class="sub">Within 30 days</div>
        </div>
        <div class="metric-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
      </div>
      <div class="metric-card mc-teal">
        <div class="metric-info">
          <div class="lbl">Monthly Revenue</div>
          <div class="val">₹${monthlyRevenue.toLocaleString('en-IN')}</div>
          <div class="sub">This month</div>
        </div>
        <div class="metric-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
      </div>
    `;

    // Orgs table — backend uses flat fields: plan_code, subscription_status
    const orgRows = orgList.slice(0,8).map(o => {
      const statusBadge = o.status === 'ACTIVE'
        ? `<span class="badge badge-green">Active</span>`
        : `<span class="badge badge-red">Suspended</span>`;
      const plan = o.plan_code && o.plan_code !== 'NONE' ? o.plan_code : '—';
      return `<tr>
        <td><strong>${o.name}</strong><br><small style="color:var(--text-muted)">${o.email||''}</small></td>
        <td>${statusBadge}</td>
        <td>${plan}</td>
      </tr>`;
    });
    document.getElementById('org-rows').innerHTML = orgRows.length
      ? orgRows.join('')
      : `<tr><td colspan="3" style="text-align:center;padding:24px;color:var(--text-muted)">No academies yet</td></tr>`;

    // Expiry rows (mock from orgs with expires_at)
    const expiryList = orgList
      .filter(o => o.subscription?.expires_at)
      .sort((a,b) => new Date(a.subscription.expires_at) - new Date(b.subscription.expires_at))
      .slice(0,6);
    const expiryRows = expiryList.map(o => {
      const exp = new Date(o.subscription.expires_at);
      const daysLeft = Math.ceil((exp - Date.now()) / 86400000);
      const dot = daysLeft < 7 ? '#EF4444' : daysLeft < 30 ? '#F59E0B' : '#10B981';
      return `<tr>
        <td><strong>${o.name}</strong></td>
        <td><div class="expiry-row"><div class="expiry-dot" style="background:${dot}"></div>${exp.toLocaleDateString('en-IN')}</div></td>
        <td><span class="badge ${daysLeft < 7 ? 'badge-red' : daysLeft < 30 ? 'badge-amber' : 'badge-green'}">${daysLeft}d left</span></td>
      </tr>`;
    });
    document.getElementById('expiry-rows').innerHTML = expiryRows.length
      ? expiryRows.join('')
      : `<tr><td colspan="3" style="text-align:center;padding:24px;color:var(--text-muted)">No expiring licenses</td></tr>`;

    // Payment rows
    const pmts = ov.recent_payments || [];
    const pmtRows = pmts.slice(0,8).map(p => `<tr>
      <td>${p.organization_name || p.organization_id}</td>
      <td><strong>₹${p.amount?.toLocaleString('en-IN')}</strong></td>
      <td><span class="badge badge-gray">${p.gateway||'cash'}</span></td>
      <td><span class="badge ${p.status==='VERIFIED'?'badge-green':p.status==='PENDING'?'badge-amber':'badge-red'}">${p.status}</span></td>
      <td>${p.paid_at ? new Date(p.paid_at).toLocaleDateString('en-IN') : '—'}</td>
    </tr>`);
    document.getElementById('payment-rows').innerHTML = pmtRows.length
      ? pmtRows.join('')
      : `<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-muted)">No payment records yet</td></tr>`;

  } catch(err) {
    toast('Failed to load dashboard: ' + err.message, 'error');
  }
</script>
</body>
</html>
