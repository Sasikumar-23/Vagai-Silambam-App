<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fees · Vagai Silambam</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .fees-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <script type="module">
    import { api } from './assets/js/api.js';
    import { applyTranslations, t } from './assets/js/i18n.js';
    import { mountShell, requireSession, toast } from './assets/js/auth.js';

    if (requireSession()) {
      const page = mountShell({ titleKey: 'nav_fees' });
      render(page);
    }

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    async function render(page) {
      page.innerHTML = '<div class="card"><div class="skeleton" style="height:220px"></div></div>';

      try {
        const [feesData, studentsData] = await Promise.all([
          api.listFees({ limit: 50 }),
          api.listStudents({ limit: 200, status: 'ACTIVE' }),
        ]);

        const studentOpts = studentsData.items.map(s =>
          `<option value="${esc(s.id)}">${esc(s.name_en)} (${esc(s.student_code)})</option>`
        ).join('');

        const studentMap = {};
        studentsData.items.forEach(s => { studentMap[s.id] = s.name_en; });

        const totalFees = feesData.reduce((acc, f) => acc + (f.amount || 0), 0);
        const paidFees = feesData.filter(f => f.status === 'PAID').reduce((acc, f) => acc + (f.amount || 0), 0);
        const pendingFees = totalFees - paidFees;

        const statsBar = `
          <div class="fees-stats">
            <div class="stat" style="border-left-color:var(--primary)">
              <div class="label">Total Invoiced</div>
              <div class="value">₹${totalFees.toLocaleString()}</div>
              <div class="sub">${feesData.length} total fee records</div>
            </div>
            <div class="stat" style="border-left-color:var(--accent)">
              <div class="label">Collected Fees</div>
              <div class="value" style="color:#059669">₹${paidFees.toLocaleString()}</div>
              <div class="sub">Paid successfully</div>
            </div>
            <div class="stat" style="border-left-color:var(--crimson)">
              <div class="label">Pending &amp; Overdue</div>
              <div class="value" style="color:#BE123C">₹${pendingFees.toLocaleString()}</div>
              <div class="sub">Outstanding dues</div>
            </div>
          </div>`;

        const addForm = `
          <div class="card" id="feeFormCard" style="display:none;animation:fadeIn 0.2s ease">
            <div class="card-head">
              <h3><span>₹</span> Add Fee Invoice</h3>
              <button type="button" class="btn btn-ghost btn-sm" id="closeFeeForm">✕</button>
            </div>
            <form id="addFeeForm" style="display:grid;gap:var(--space-4);grid-template-columns:1fr 1fr">
              <div class="field" style="grid-column:1/-1">
                <label>Student</label>
                <select id="feeStudent" required><option value="">— Select Student —</option>${studentOpts}</select>
              </div>
              <div class="field">
                <label>Fee Title</label>
                <input id="feeTitle" type="text" required placeholder="e.g. October Monthly Tuition">
              </div>
              <div class="field">
                <label>Amount (₹)</label>
                <input id="feeAmount" type="number" required min="1" step="50" placeholder="500">
              </div>
              <div class="field">
                <label>Due Date</label>
                <input id="feeDue" type="date">
              </div>
              <div class="field">
                <label>Fee Category</label>
                <select id="feeType">
                  <option value="MONTHLY_TUITION">Monthly Tuition</option>
                  <option value="ADMISSION">Admission Fee</option>
                  <option value="EXAM">Belt Exam Fee</option>
                  <option value="UNIFORM">Uniform &amp; Kit</option>
                  <option value="EVENT">Tournament &amp; Event</option>
                </select>
              </div>
              <div style="grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;margin-top:6px">
                <button type="button" class="btn btn-ghost" id="cancelFeeBtn">Cancel</button>
                <button type="submit" class="btn btn-primary">Create Fee Invoice</button>
              </div>
            </form>
          </div>`;

        const rows = feesData.map(fee => {
          const statusCls = { PAID: 'badge-active', PENDING: 'badge-trial', OVERDUE: 'badge-suspended' }[fee.status] || '';
          const payBtn = fee.status !== 'PAID'
            ? `<button class="btn btn-ghost btn-sm pay-btn" style="color:#059669;border-color:#A7F3D0;background:#ECFDF5;font-weight:700" data-id="${esc(fee.id)}" data-amount="${fee.amount}">✓ Mark Paid</button>`
            : `<span style="font-size:12px;color:var(--text-muted)">Receipt: #${esc(fee.receipt_number || 'OK')}</span>`;

          const studentName = studentMap[fee.student_id] || fee.student_id;

          return `<tr>
            <td style="font-weight:700">${esc(fee.title_en)}</td>
            <td>${esc(studentName)}</td>
            <td style="font-weight:800;color:var(--text)">₹${fee.amount.toLocaleString()}</td>
            <td>${esc(fee.due_date || '—')}</td>
            <td>${esc(fee.paid_date || '—')}</td>
            <td><span class="badge ${statusCls}">${esc(fee.status)}</span></td>
            <td style="text-align:right">${payBtn}</td>
          </tr>`;
        }).join('');

        const table = feesData.length ? `
          <div class="card" style="padding:0;overflow:hidden">
            <div class="card-head" style="padding:22px 24px 14px;margin-bottom:0">
              <h3><span>📋</span> Fee Records</h3>
              <div style="display:flex;gap:10px;align-items:center">
                <button id="toggleFeeFormBtn" class="btn btn-primary btn-sm">+ Add New Fee</button>
                <button id="exportFees" class="btn btn-ghost btn-sm">📥 Export CSV</button>
              </div>
            </div>
            <div style="overflow-x:auto">
              <table>
                <thead><tr>
                  <th>Title</th><th>Student</th><th>Amount</th><th>Due Date</th>
                  <th>Paid Date</th><th>Status</th><th style="text-align:right">Action</th>
                </tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>` : `
          <div class="card">
            <div class="empty">
              <div class="mark">₹</div>
              <h3>No fee records yet</h3>
              <p>Add invoices and fee tracking for academy students.</p>
              <button id="toggleFeeFormBtnEmpty" class="btn btn-primary btn-sm" style="margin-top:12px">+ Add First Fee</button>
            </div>
          </div>`;

        page.innerHTML = statsBar + addForm + table;
        applyTranslations(page);

        // Toggle form logic
        const formCard = document.getElementById('feeFormCard');
        const showForm = () => { formCard.style.display = 'block'; };
        const hideForm = () => { formCard.style.display = 'none'; };

        const btn1 = document.getElementById('toggleFeeFormBtn');
        const btn2 = document.getElementById('toggleFeeFormBtnEmpty');
        const closeBtn = document.getElementById('closeFeeForm');
        const cancelBtn = document.getElementById('cancelFeeBtn');

        if (btn1) btn1.addEventListener('click', showForm);
        if (btn2) btn2.addEventListener('click', showForm);
        if (closeBtn) closeBtn.addEventListener('click', hideForm);
        if (cancelBtn) cancelBtn.addEventListener('click', hideForm);

        document.getElementById('addFeeForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const btn = e.target.querySelector('button[type=submit]');
          btn.disabled = true;
          try {
            await api.createFee({
              student_id: document.getElementById('feeStudent').value,
              title_en: document.getElementById('feeTitle').value.trim(),
              amount: parseFloat(document.getElementById('feeAmount').value),
              fee_type: document.getElementById('feeType').value,
              due_date: document.getElementById('feeDue').value || null,
            });
            toast('Fee invoice created successfully!', 'success');
            render(page);
          } catch (err) { toast(err.message, 'error'); } finally { btn.disabled = false; }
        });

        page.querySelectorAll('.pay-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            const mode = prompt('Payment mode? (CASH / UPI / BANK_TRANSFER / CARD)', 'UPI');
            if (!mode) return;
            try {
              await api.payFee(id, { payment_mode: mode.toUpperCase() });
              toast('Payment successfully recorded!', 'success');
              render(page);
            } catch (err) { toast(err.message, 'error'); }
          });
        });

        const expBtn = document.getElementById('exportFees');
        if (expBtn) {
          expBtn.addEventListener('click', async () => {
            try {
              const res = await api.exportFeesCSV();
              const blob = await res.blob();
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a'); a.href = url; a.download = 'fees.csv'; a.click();
              URL.revokeObjectURL(url);
              toast('CSV file downloaded', 'success');
            } catch (e) {
              toast('Export failed', 'error');
            }
          });
        }

      } catch (err) {
        page.innerHTML = `<div class="alert alert-error">${esc(err.message)}</div>`;
      }
    }
  </script>
</body>
</html>
