<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E2424"/>
      <stop offset="1" stop-color="#3A0C0C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD769"/>
      <stop offset="1" stop-color="#E49A12"/>
    </linearGradient>
    <linearGradient id="bamboo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9D07A"/>
      <stop offset="0.5" stop-color="#E9F2B8"/>
      <stop offset="1" stop-color="#8FAE4A"/>
    </linearGradient>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- soft glow -->
    <circle cx="256" cy="256" r="230" fill="#C2452D" opacity="0.18"/>

    <!-- kolam-style dot ring -->
    <g fill="#FFD769" opacity="0.85">
      <circle cx="256" cy="52" r="6"/><circle cx="256" cy="460" r="6"/>
      <circle cx="52" cy="256" r="6"/><circle cx="460" cy="256" r="6"/>
      <circle cx="111" cy="111" r="5"/><circle cx="401" cy="111" r="5"/>
      <circle cx="111" cy="401" r="5"/><circle cx="401" cy="401" r="5"/>
    </g>

    <!-- gold rings -->
    <circle cx="256" cy="256" r="188" fill="none" stroke="url(#gold)" stroke-width="12"/>
    <circle cx="256" cy="256" r="170" fill="none" stroke="#FFD769" stroke-width="2.5" opacity="0.7"/>

    <!-- crossed staves -->
    <g id="staff">
      <g transform="rotate(45 256 256)">
        <rect x="244" y="62" width="24" height="388" rx="12" fill="url(#bamboo)" stroke="#5E7A2A" stroke-width="2"/>
        <g stroke="#5E7A2A" stroke-width="3" stroke-linecap="round">
          <line x1="244" y1="130" x2="268" y2="130"/>
          <line x1="244" y1="200" x2="268" y2="200"/>
          <line x1="244" y1="312" x2="268" y2="312"/>
          <line x1="244" y1="382" x2="268" y2="382"/>
        </g>
        <rect x="242" y="62" width="28" height="22" rx="8" fill="url(#gold)"/>
        <rect x="242" y="428" width="28" height="22" rx="8" fill="url(#gold)"/>
      </g>
      <g transform="rotate(-45 256 256)">
        <rect x="244" y="62" width="24" height="388" rx="12" fill="url(#bamboo)" stroke="#5E7A2A" stroke-width="2"/>
        <g stroke="#5E7A2A" stroke-width="3" stroke-linecap="round">
          <line x1="244" y1="130" x2="268" y2="130"/>
          <line x1="244" y1="200" x2="268" y2="200"/>
          <line x1="244" y1="312" x2="268" y2="312"/>
          <line x1="244" y1="382" x2="268" y2="382"/>
        </g>
        <rect x="242" y="62" width="28" height="22" rx="8" fill="url(#gold)"/>
        <rect x="242" y="428" width="28" height="22" rx="8" fill="url(#gold)"/>
      </g>
    </g>

    <!-- sash knot at crossing -->
    <circle cx="256" cy="256" r="34" fill="#D93A2B" stroke="#FFD769" stroke-width="6"/>
    <circle cx="256" cy="256" r="14" fill="#FFD769"/>
    <path d="M232 280 L214 322 L238 312 L246 334 L256 292 Z" fill="#D93A2B" stroke="#FFD769" stroke-width="3" stroke-linejoin="round"/>
    <path d="M280 280 L298 322 L274 312 L266 334 L256 292 Z" fill="#B82A1E" stroke="#FFD769" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
